<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <rect width="1680" height="1100" fill="#f7f4ee"/>
  <text x="28" y="30" font-size="20" font-weight="700" fill="#1c1916">Котёл v2 — теплообменник Житомир-3 КС-Г-015 после переделки</text>
  <text x="28" y="52" font-size="13" fill="#3d3832">ОТВЕРГНУТ как вид переда. Не рабочий чертёж. Актуальный перед: photos/котел-перед.jpg</text>

  <text x="28" y="82" font-size="15" font-weight="700">Спереди, по фото, не обмер</text>
  <g transform="translate(28,96)">
    <rect x="36" y="8" width="210" height="470" fill="#e7e2da" stroke="#1c1916" stroke-width="2"/>
    <g fill="#fff8ef" stroke="#c46a12" stroke-width="1.2" stroke-dasharray="4 3">
      <rect x="58" y="28" width="18" height="120"/>
      <rect x="84" y="28" width="18" height="120"/>
      <rect x="110" y="28" width="18" height="120"/>
      <rect x="136" y="28" width="18" height="120"/>
      <rect x="162" y="28" width="18" height="120"/>
      <rect x="188" y="28" width="18" height="120"/>
    </g>
    <text x="141" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#c46a12">6 каналов?</text>
    <text x="141" y="108" text-anchor="middle" font-size="11" fill="#8a4e10">видны сверху. Лист устарел</text>
    <rect x="52" y="300" width="178" height="88" fill="#f4efe4" stroke="#1c1916" stroke-width="2"/>
    <rect x="52" y="286" width="178" height="14" fill="none" stroke="#1c1916" stroke-width="2"/>
    <rect x="52" y="388" width="178" height="14" fill="none" stroke="#1c1916" stroke-width="2"/>
    <rect x="38" y="300" width="14" height="88" fill="none" stroke="#1c1916" stroke-width="2"/>
    <rect x="230" y="300" width="14" height="88" fill="none" stroke="#1c1916" stroke-width="2"/>
    <text x="141" y="326" text-anchor="middle" font-size="13" font-weight="700">проём в свету</text>
    <text x="141" y="344" text-anchor="middle" font-size="12">H = 240 мм</text>
    <text x="141" y="362" text-anchor="middle" font-size="11">B = 170 мм</text>
    <text x="141" y="378" text-anchor="middle" font-size="11" fill="#8a4e10">этот лист устарел</text>
    <text x="141" y="430" text-anchor="middle" font-size="11">крышка 2 мм, перед ниже</text>
    <path d="M36 478 h28 l14 28 h-28 z M218 478 h28 l-14 28 h-28 z" fill="none" stroke="#1c1916" stroke-width="1.6" stroke-dasharray="4 2"/>
    <text x="141" y="528" text-anchor="middle" font-size="11" fill="#8a4e10">опоры низкие, контур условный</text>
  </g>
  <text x="28" y="650" font-size="12">Полки: верх вверх, низ вниз,</text>
  <text x="28" y="668" font-size="12">бока в стороны.</text>
  <text x="28" y="686" font-size="12">B проёма = B внутри ТО.</text>
  <text x="28" y="704" font-size="12" fill="#8a4e10">Число B нет. Не рама 240×170.</text>

  <text x="430" y="82" font-size="15" font-weight="700">Сбоку, по фото, не обмер</text>
  <g transform="translate(430,96)">
    <rect x="36" y="8" width="250" height="392" fill="#d5e4f0" stroke="#1c1916" stroke-width="2"/>
    <g fill="#fff8ef" stroke="#c46a12" stroke-dasharray="4 3">
      <rect x="52" y="24" width="26" height="110"/>
      <rect x="86" y="24" width="26" height="110"/>
      <rect x="120" y="24" width="26" height="110"/>
      <rect x="154" y="24" width="26" height="110"/>
      <rect x="188" y="24" width="26" height="110"/>
      <rect x="222" y="24" width="26" height="110"/>
    </g>
    <polygon points="48,180 274,180 274,392 48,392" fill="#f4efe4" stroke="#1c1916"/>
    <text x="160" y="230" text-anchor="middle" font-size="13" font-weight="700">топка</text>
    <text x="160" y="250" text-anchor="middle" font-size="11">дно повышается назад</text>
    <line x1="36" y1="250" x2="36" y2="330" stroke="#1c1916" stroke-width="4"/>
    <text x="44" y="246" font-size="11">проём</text>
    <path d="M28,456 L210,404 L236,404 L236,428" fill="none" stroke="#1c1916" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="236" cy="404" r="4" fill="#c46a12"/>
    <text x="150" y="370" font-size="11">изгиб к низу воды</text>
    <text x="300" y="330" font-size="11">обратка</text>
    <text x="300" y="346" font-size="10" fill="#6a6258">штуцер не обмерен</text>
    <line x1="16" y1="404" x2="28" y2="404" stroke="#1c1916"/>
    <line x1="16" y1="456" x2="28" y2="456" stroke="#1c1916"/>
    <line x1="16" y1="404" x2="16" y2="456" stroke="#1c1916"/>
    <text x="2" y="448" font-size="10">≈30</text>
    <path d="M24,456 h18 l8 22 h-16 z" fill="none" stroke="#1c1916" stroke-dasharray="3 2"/>
    <path d="M220,428 h22 l10 22 h-18 z" fill="none" stroke="#1c1916" stroke-dasharray="3 2"/>
  </g>
  <text x="430" y="640" font-size="12">Изгиб оригинала, сразу перед опорами.</text>
  <text x="430" y="658" font-size="12">Сзади он приварен к низу воды,</text>
  <text x="430" y="676" font-size="12">там вход холодной воды.</text>
  <text x="430" y="694" font-size="12">Перед ниже изгиба ≈30 мм.</text>
  <text x="430" y="712" font-size="12" fill="#8a4e10">По словам Антона. Угол не строится.</text>
  <text x="430" y="730" font-size="12" fill="#8a4e10">Опоры низкие, не стойки из трубы.</text>

  <text x="900" y="82" font-size="15" font-weight="700">Масштаб только здесь</text>
  <g transform="translate(900,100)">
    <rect width="740" height="250" fill="#fff" stroke="#1c1916"/>
    <text x="16" y="22" font-size="13" font-weight="700">В масштабе линейки: только 240 мм.</text>
    <line x1="24" y1="40" x2="24" y2="200" stroke="#1c1916" stroke-width="2"/>
    <line x1="16" y1="40" x2="32" y2="40" stroke="#1c1916"/>
    <line x1="16" y1="200" x2="32" y2="200" stroke="#1c1916"/>
    <text x="36" y="100" font-size="12">H = 240 мм</text>
    <text x="36" y="118" font-size="11" fill="#8a4e10">B не 240</text>
    <text x="180" y="48" font-size="12" font-weight="700">Увеличено, не в масштабе линейки</text>
    <line x1="180" y1="70" x2="180" y2="150" stroke="#1c1916" stroke-width="3"/>
    <text x="158" y="96" font-size="11">ТО</text>
    <line x1="180" y1="150" x2="210" y2="150" stroke="#c46a12" stroke-width="1.4"/>
    <line x1="186" y1="146" x2="186" y2="154" stroke="#c46a12"/>
    <line x1="204" y1="146" x2="204" y2="154" stroke="#c46a12"/>
    <text x="193" y="142" text-anchor="middle" font-size="11" fill="#8a4e10">5</text>
    <path d="M210 130 h28 v20 h-12 v-8 h-16 z" fill="none" stroke="#1c1916" stroke-width="2"/>
    <text x="246" y="126" font-size="12">полка 25</text>

    <text x="460" y="70" font-size="12">Рама горелки 240×170.</text>
    <text x="460" y="90" font-size="12" fill="#8a4e10">Какая сторона 240 — нет.</text>
    <text x="460" y="114" font-size="12">Лист крышки 2 мм.</text>
    <text x="460" y="138" font-size="12">Уголок переднего проёма</text>
    <text x="460" y="156" font-size="12">не измерен. Это не 25 мм</text>
    <text x="460" y="174" font-size="12">само по себе.</text>
    <text x="16" y="214" font-size="12">край уголков до теплообменника ≈15 мм. Лист устарел</text>
    <text x="16" y="234" font-size="12" fill="#8a4e10">Из 25 мм и 5 мм ширина и высота корпуса не выводятся. Рабочего чертежа ещё нет.</text>
  </g>

  <g transform="translate(900,370)">
    <rect width="740" height="200" fill="#fff6f5" stroke="#b42318"/>
    <text x="16" y="24" font-size="14" font-weight="700" fill="#b42318">Опрессовка 4 атм — неудачная</text>
    <text x="16" y="48" font-size="13">Изгиб виден спереди. Перед и зад не деформировались.</text>
    <text x="16" y="68" font-size="13">Какие поверхности и остался ли изгиб — не сказано.</text>
    <text x="16" y="88" font-size="13">Швы сочились. После перегрузки нужен осмотр. Не топить.</text>
    <text x="16" y="116" font-size="12" fill="#5c564e">Паспорт 2026 для облицованного КС-Г-015СН: 860×280×500/530.</text>
    <text x="16" y="136" font-size="12" fill="#5c564e">Это не голый теплообменник и не масштаб этого листа.</text>
    <text x="16" y="156" font-size="12" fill="#5c564e">Давления паспорта между собой расходятся и сюда не переносятся.</text>
    <text x="16" y="184" font-size="12" fill="#8a4e10">Форма опор после подрезки: на фото контур, профиль реза нужен отдельный снимок.</text>
  </g>

  <g transform="translate(900,590)">
    <rect width="740" height="120" fill="#f3f1ea" stroke="#8a8378" stroke-dasharray="5 3"/>
    <text x="16" y="24" font-size="14" font-weight="700">Шкаф — соседняя папка</text>
    <text x="16" y="48" font-size="13">Рамка шкафа: Ш около 1000, В около 1500, план Г около 400.</text>
    <text x="16" y="68" font-size="13">Оборудование в шкафу без масштаба, пока нет обмеров.</text>
    <text x="16" y="96" font-size="12" fill="#5c564e">blueprints/boiler-cabinet. Котёл v2 там не в масштабе рамки.</text>
  </g>

  <text x="28" y="780" font-size="14" font-weight="700">Что видно на фото и что нет</text>
  <text x="28" y="804" font-size="12">Фото: photos/котел-1.jpg, photos/котел-2.jpg. Корпус высокий, проём в нижней части, заметно ниже половины высоты.</text>
  <text x="28" y="824" font-size="12">Рядом с проёмом на боковой грани нижняя накладка. Опоры короткие, по углам низа, не вертикальные стойки.</text>
  <text x="28" y="844" font-size="12">Трубы на полу в кадре к котлу не приварены. Число опор, сечение и угол спила по снимкам не назначаются.</text>
  <text x="28" y="864" font-size="12">Шесть каналов видны на фото верха. Этот лист устарел. Исполнение СН на доноре не подтверждено.</text>
  <text x="28" y="892" font-size="12" fill="#5c564e">Паспорт Житомир-3 2026-01, atem.ua/files/2026/passport-zh-3-2026.pdf — габариты серии, не обмер этого котла.</text>
</svg>
