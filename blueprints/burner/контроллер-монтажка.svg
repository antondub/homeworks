<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="DejaVu Sans, sans-serif">
  <title>Монтажка</title>
  <text x="540" y="28" text-anchor="middle" font-size="20" fill="#222">Монтажка</text>

  <rect x="210" y="70" width="620" height="600" fill="#f4f4f4" stroke="#222" stroke-width="2"/>

  <text x="520" y="58" text-anchor="middle" font-size="15" fill="#222">12 В</text>
  <line x1="360" y1="70" x2="360" y2="48" stroke="#222" stroke-width="1.5"/>

  <rect x="250" y="96" width="220" height="110" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="360" y="124" text-anchor="middle" font-size="16" fill="#222">питание 5 В</text>
  <text x="266" y="152" font-size="15" fill="#222">LM2596</text>
  <text x="266" y="176" font-size="15" fill="#222">5 В на VIN и HV</text>

  <rect x="250" y="250" width="220" height="160" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="360" y="278" text-anchor="middle" font-size="16" fill="#222">3,3 / 5 В</text>
  <text x="266" y="306" font-size="15" fill="#222">LV 3,3 В, HV 5 В</text>
  <text x="266" y="330" font-size="15" fill="#222">1 — GPIO25</text>
  <text x="266" y="354" font-size="15" fill="#222">2 — GPIO26</text>
  <text x="266" y="378" font-size="15" fill="#222">3 и 4 пустые</text>

  <rect x="250" y="460" width="220" height="150" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="360" y="488" text-anchor="middle" font-size="16" fill="#222">MAX6675</text>
  <text x="266" y="516" font-size="15" fill="#222">SO GPIO12</text>
  <text x="266" y="540" font-size="15" fill="#222">SCK GPIO14</text>
  <text x="266" y="564" font-size="15" fill="#222">CS GPIO27</text>
  <text x="266" y="588" font-size="15" fill="#222">VCC 3,3 В</text>
  <rect x="168" y="500" width="82" height="70" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="209" y="530" text-anchor="middle" font-size="14" fill="#222">+</text>
  <text x="209" y="552" text-anchor="middle" font-size="14" fill="#222">−</text>

  <text x="100" y="470" text-anchor="end" font-size="15" fill="#222">термопара K</text>
  <line x1="168" y1="535" x2="120" y2="478" stroke="#222" stroke-width="1.5"/>

  <text x="40" y="300" font-size="15" fill="#222">ESC воздух</text>
  <text x="40" y="360" font-size="15" fill="#222">ESC насос</text>
  <line x1="210" y1="330" x2="150" y2="304" stroke="#222" stroke-width="1.5"/>
  <line x1="210" y1="354" x2="140" y2="364" stroke="#222" stroke-width="1.5"/>

  <rect x="540" y="96" width="250" height="500" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="665" y="124" text-anchor="middle" font-size="16" fill="#222">ESP32</text>
  <text x="556" y="160" font-size="15" fill="#222">VIN 5 В</text>
  <text x="556" y="188" font-size="15" fill="#222">25 воздух</text>
  <text x="556" y="212" font-size="15" fill="#222">26 насос</text>
  <text x="556" y="236" font-size="15" fill="#222">33 батарея</text>
  <text x="556" y="268" font-size="15" fill="#222">12 SO</text>
  <text x="556" y="292" font-size="15" fill="#222">14 SCK</text>
  <text x="556" y="316" font-size="15" fill="#222">27 CS</text>
  <text x="665" y="560" text-anchor="middle" font-size="15" fill="#222">USB</text>

  <line x1="470" y1="160" x2="540" y2="156" stroke="#222" stroke-width="1.5"/>
  <line x1="470" y1="330" x2="540" y2="184" stroke="#222" stroke-width="1.5"/>
  <line x1="470" y1="354" x2="540" y2="208" stroke="#222" stroke-width="1.5"/>
  <line x1="470" y1="516" x2="540" y2="264" stroke="#222" stroke-width="1.5"/>
  <line x1="470" y1="540" x2="540" y2="288" stroke="#222" stroke-width="1.5"/>
  <line x1="470" y1="564" x2="540" y2="312" stroke="#222" stroke-width="1.5"/>

  <g font-size="15" fill="#222">
    <text x="900" y="250">GPIO18 свободный</text>
    <text x="900" y="290">GPIO19 розжиг</text>
    <text x="900" y="330">GPIO21 стоп</text>
    <text x="900" y="370">GPIO22 прямой</text>
    <text x="900" y="410">GPIO23 ключ ESC</text>
  </g>
  <line x1="790" y1="246" x2="890" y2="246" stroke="#222" stroke-width="1.5"/>
  <line x1="790" y1="286" x2="890" y2="286" stroke="#222" stroke-width="1.5"/>
  <line x1="790" y1="326" x2="890" y2="326" stroke="#222" stroke-width="1.5"/>
  <line x1="790" y1="366" x2="890" y2="366" stroke="#222" stroke-width="1.5"/>
  <line x1="790" y1="406" x2="890" y2="406" stroke="#222" stroke-width="1.5"/>

  <text x="560" y="700" font-size="15" fill="#222">термобатарея + GPIO33</text>
  <text x="560" y="724" font-size="15" fill="#222">термобатарея − GND</text>
  <line x1="620" y1="670" x2="600" y2="692" stroke="#222" stroke-width="1.5"/>
  <line x1="700" y1="670" x2="720" y2="716" stroke="#222" stroke-width="1.5"/>
</svg>
