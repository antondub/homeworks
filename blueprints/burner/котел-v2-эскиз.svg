<text x="24" y="28" font-size="9" font-weight="700">Котёл v2 — теплообменник Житомир-3 КС-Г-015 после переделки</text>
<text x="24" y="46" font-size="4.4">Эскиз для согласования, не рабочий чертёж. 1 ед. = 1 мм.</text>
<text x="24" y="60" font-size="4.4">Сплошная размерная линия — замер Антона или модель горелки. Пунктир и ≈ — чтение фото, не подтверждено.</text>
<text x="24" y="74" font-size="4.4">Опоры и каналы пунктиром, без размера. Положение проёма по высоте не снято.</text>
