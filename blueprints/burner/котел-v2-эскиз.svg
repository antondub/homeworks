<text x="24" y="1156" font-size="4.3">700 и проём B170 × H240 — прямой замер Антона. 700 — общая высота с опорами, не высота рубашки.</text>
<text x="24" y="1170" font-size="4.3">≈335±5 вдоль и ≈200±5 поперёк — чтение фото верха, ноль крючка на дальнем крае. Антон не подтвердил.</text>
<text x="24" y="1184" font-size="4.3">≈340 до внутренней кромки и ≈380 до наружной полки — фото глубины. Крючок у задней стенки неясен.</text>
<text x="24" y="1198" font-size="4.3">≈210±5 — наружная ширина рамки по фото. 25 мм, 5 мм и ≈30 — со слов Антона, в габарит не переведены.</text>
<text x="24" y="1212" font-size="4.3">Горелка по модели: наружу квадрат 180, внутрь 150 вдоль оси (переход 50 + труба 100, Ø100). В SCAD ещё Ø90.</text>
<text x="24" y="1226" font-size="4.3">Запас хода сверх 150 не задан. Прежние 295, 160, 170–190 мм и 20–29 см в расчёт не входят.</text>
