<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2592" height="5016" viewBox="0 0 2592 5016" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <rect width="2592" height="5016" fill="#f7f4ee"/>
  <image xlink:href="котел-каркас-перевернут.jpg" x="0" y="0" width="2592" height="4608"/>
  <circle cx="700" cy="1500" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="700" y="1516" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">2</text><circle cx="1150" cy="1280" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="1150" y="1296" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">3</text><circle cx="720" cy="1750" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="720" y="1766" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">1</text><circle cx="1400" cy="2500" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="1400" y="2516" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">4</text>
  <text x="40" y="4688" font-size="42" font-weight="700" fill="#1c1916">ПЕРЕВЁРНУТ. Стадия сварки каркаса, не сборка с горелкой.</text><text x="40" y="4744" font-size="36" fill="#1c1916">1 каркас из уголка. В кадре сверху — это будущий низ.</text><text x="40" y="4792" font-size="36" fill="#1c1916">2 передняя рамка этого каркаса.</text><text x="40" y="4840" font-size="36" fill="#1c1916">3 наклон плоскости виден. Угол кадром не измерен.</text><text x="40" y="4888" font-size="36" fill="#1c1916">4 корпус теплообменника.</text><text x="40" y="4952" font-size="30" fill="#6a6258">Струбцина, стол и полки — не котёл. Размеры 240, 25, 5 и 30 мм сюда не нанесены.</text>
</svg>
