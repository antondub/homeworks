<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 900 1060" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <rect width="900" height="1060" fill="#f7f4ee"/>
  <text x="28" y="36" font-size="22" font-weight="700" fill="#1c1916">Котёл v2. Контур видимого каркаса</text>
  <text x="28" y="62" font-size="14" fill="#3d3832">По фото сварки, рабочая ориентация. Не обмер и не скрытые опоры.</text>
  <g transform="translate(220,90)">
    <!-- горелка: 1 мм = 0.55 px. Плоскость рамки x=40. Сначала, чтобы контур котла остался сверху. -->
    <g fill="#7f93a8" fill-opacity="0.12" stroke="#3d5a73" stroke-width="1.6" stroke-dasharray="5 3">
      <rect x="-59" y="545" width="99" height="55"/>
      <rect x="40" y="552" width="27" height="41"/>
      <rect x="67" y="552" width="55" height="41"/>
    </g>
    <line x1="40" y1="520" x2="40" y2="630" stroke="#3d5a73" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="-10" y="535" text-anchor="end" font-size="12" fill="#3d5a73">фланец</text>
    <text x="-10" y="640" text-anchor="end" font-size="12" fill="#3d5a73">наружу 180</text>
    <text x="130" y="675" font-size="12" fill="#3d5a73">внутрь 150</text>
    <g fill="none" stroke="#1c1916" stroke-width="3">
      <rect x="80" y="40" width="280" height="420"/>
      <path d="M40 500 h360 l40 70 h-440 z"/>
      <path d="M40 500 v150 h120 v-150"/>
      <line x1="80" y1="575" x2="400" y2="500" stroke="#c46a12" stroke-width="2"/>
    </g>
    <text x="220" y="250" text-anchor="middle" font-size="16" fill="#1c1916">корпус</text>
    <text x="250" y="548" text-anchor="middle" font-size="14" fill="#1c1916">каркас из уголка</text>
    <text x="100" y="492" text-anchor="middle" font-size="13" fill="#1c1916">перед</text>
  </g>
  <text x="28" y="820" font-size="15" fill="#1c1916">Наклон плоскости виден на фото. Величина с кадра не снята.</text>
  <text x="28" y="848" font-size="15" fill="#1c1916">Перед ниже заднего изгиба ≈30 мм — слова Антона, не обмер кадра.</text>
  <text x="28" y="876" font-size="15" fill="#1c1916">Опоры не нарисованы: на этом фото их формы нет.</text>
  <text x="28" y="904" font-size="15" fill="#1c1916">Пунктир — горелка v2: квадрат 100×100 на 180 мм снаружи, переход 50 и труба 100 мм внутри.</text>
  <text x="28" y="928" font-size="15" fill="#1c1916">Фланец в плоскости рамки. Заливка условная. Контур котла не в масштабе горелки.</text>
  <text x="28" y="976" font-size="15" fill="#1c1916">Текущая сборка с горелкой — другое фото, котел-перед.</text>
  <text x="28" y="1004" font-size="14" fill="#6a6258">Лист котел-житомир-015.svg видом переда не является.</text>
</svg>
