<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2592" height="5016" viewBox="0 0 2592 5016" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <rect width="2592" height="5016" fill="#f7f4ee"/>
  <image xlink:href="котел-каркас-рабочая.jpg" x="0" y="0" width="2592" height="4608"/>
  <circle cx="1892" cy="3108" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="1892" y="3124" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">2</text><circle cx="1442" cy="3328" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="1442" y="3344" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">3</text><circle cx="1872" cy="2858" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="1872" y="2874" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">1</text><circle cx="1192" cy="2108" r="48" fill="#fff" stroke="#1c1916" stroke-width="6"/><text x="1192" y="2124" text-anchor="middle" font-size="42" font-weight="700" fill="#1c1916">4</text>
  <text x="40" y="4688" font-size="42" font-weight="700" fill="#1c1916">Та же фотография, поворот на 180°. Каркас снизу, как будет стоять.</text><text x="40" y="4744" font-size="36" fill="#1c1916">1 каркас из уголка, будущий низ — теперь внизу кадра.</text><text x="40" y="4792" font-size="36" fill="#1c1916">2 передняя рамка.</text><text x="40" y="4840" font-size="36" fill="#1c1916">3 наклон виден, не измерен.</text><text x="40" y="4888" font-size="36" fill="#1c1916">4 корпус. Это не новая сборка и не чертёж.</text><text x="40" y="4952" font-size="30" fill="#6a6258">Опоры под каркасом на снимке не видны и не дорисованы. Струбцина не котёл.</text>
</svg>
