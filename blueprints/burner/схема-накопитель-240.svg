  <text x="510" y="272" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="13" fill="#3c342c">240 л</text>

  <rect x="588" y="168" width="22" height="10" fill="#cfc6b8" stroke="#2a241e" stroke-width="1.3"/>
