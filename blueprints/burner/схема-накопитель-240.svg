  <rect x="28" y="200" width="150" height="90" rx="6" fill="#c5dcea" stroke="#2a241e" stroke-width="1.8"/>
  <text x="103" y="240" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#241c16">котёл</text>
  <text x="103" y="262" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#3c342c">кега 30 л</text>

  <path d="M 178,220 H 248" fill="none" stroke="#c45c12" stroke-width="2.4"/>
