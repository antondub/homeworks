  <rect x="610" y="298" width="28" height="14" rx="2" fill="#cfc6b8" stroke="#2a241e" stroke-width="1.5"/>
  <rect x="618" y="312" width="14" height="16" rx="2" fill="#cfc6b8" stroke="#2a241e" stroke-width="1.5"/>
  <rect x="636" y="298" width="28" height="14" rx="2" fill="#cfc6b8" stroke="#2a241e" stroke-width="1.5"/>
