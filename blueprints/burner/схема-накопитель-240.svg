  <rect x="588" y="432" width="22" height="10" fill="#cfc6b8" stroke="#2a241e" stroke-width="1.3"/>

  <rect x="610" y="166" width="36" height="14" rx="2" fill="#cfc6b8" stroke="#2a241e" stroke-width="1.5"/>
  <rect x="622" y="152" width="14" height="18" rx="2" fill="#cfc6b8" stroke="#2a241e" stroke-width="1.5"/>
