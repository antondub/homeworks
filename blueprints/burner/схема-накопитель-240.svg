<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#f6f3ea"/>
  <text x="28" y="36" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#241c16">Накопитель 240 л, три 1"</text>
  <text x="28" y="58" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="13" fill="#6b6258">Тройники на штуцерах. Котёл на верх, обратка со средней. Три насоса.</text>
  <line x1="28" y1="70" x2="1072" y2="70" stroke="#e0d6c6" stroke-width="1"/>

