  <text x="905" y="442" text-anchor="middle" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#3c342c">низ + средняя</text>

  <path d="M 664,305 H 748" fill="none" stroke="#c45c12" stroke-width="2.4"/>
  <g transform="translate(762,305)">
