  <polygon points="820,410 810,405 810,415" fill="#c45c12"/>
  <text x="700" y="360" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="11" fill="#c45c12">насос ТП</text>

  <path d="M 820,450 H 700 V 437 H 638" fill="none" stroke="#2a6f9b" stroke-width="2.4"/>
  <polygon points="638,437 648,432 648,442" fill="#2a6f9b"/>
  <text x="660" y="472" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#2a6f9b">обратка ТП в низ</text>

  <text x="28" y="560" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#6b6258">Верх: подача котла + ГВС. Средняя: два тройника — обратка котла, обратка ГВС, подача ТП. Низ: только обратка ТП.</text>
