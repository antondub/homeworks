  </g>
  <path d="M 276,220 V 100 H 629 V 152" fill="none" stroke="#c45c12" stroke-width="2.4"/>
  <polygon points="629,152 624,142 634,142" fill="#c45c12"/>
  <text x="286" y="210" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="11" fill="#c45c12">насос котла</text>

  <path d="M 625,328 V 350 H 250 V 260 H 178" fill="none" stroke="#2a6f9b" stroke-width="2.4"/>
  <polygon points="178,260 188,255 188,265" fill="#2a6f9b"/>
  <text x="190" y="372" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#2a6f9b">обратка котла</text>

  <rect x="820" y="120" width="170" height="90" rx="6" fill="#e8d3b0" stroke="#8c3b14" stroke-width="1.8"/>
