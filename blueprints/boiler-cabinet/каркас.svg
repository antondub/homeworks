<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="Liberation Sans, DejaVu Sans, sans-serif">
<rect width="1280" height="920" fill="#f6f3ea"/>
<text x="28" y="34" font-size="22" font-weight="700" fill="#241c16">Каркас шкафа</text>
<text x="28" y="54" font-size="13" fill="#6b6258">Уголок 25×25, стык встык. Наружные 1000×400×1450. Толщина в длины не входит.</text>
<line x1="28" y1="66" x2="1252" y2="66" stroke="#e0d6c6" stroke-width="1"/>

<text x="36" y="92" font-size="15" font-weight="700" fill="#241c16">Фасад</text>
<g transform="translate(40,108) scale(0.30)" fill="none" stroke="#2a241e">
<line x1="0" y1="0" x2="1000" y2="0" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="0" y="107" width="25" height="1343" fill="#e7e0d4" stroke-width="4"/>
<rect x="975" y="107" width="25" height="1343" fill="#e7e0d4" stroke-width="4"/>
<rect x="25" y="107" width="950" height="25" fill="#fffdf8" stroke-width="4"/>
<rect x="25" y="1425" width="950" height="25" fill="#fffdf8" stroke-width="4"/>
<rect x="25" y="370" width="950" height="25" fill="#fffdf8" stroke-width="4"/>
<text x="40" y="700" font-size="40" fill="#c45c12" stroke="none" font-weight="700">П2</text>
<text x="820" y="700" font-size="40" fill="#c45c12" stroke="none" font-weight="700">П2</text>
<text x="450" y="98" font-size="40" fill="#c45c12" stroke="none" font-weight="700">В2</text>
<text x="450" y="355" font-size="40" fill="#c45c12" stroke="none" font-weight="700">С1</text>
<text x="450" y="1412" font-size="40" fill="#c45c12" stroke="none" font-weight="700">Н1</text>
<text x="360" y="-20" font-size="32" fill="#3c342c" stroke="none">зад 1450</text>
<text x="40" y="170" font-size="32" fill="#3c342c" stroke="none">1343</text>
<text x="800" y="430" font-size="32" fill="#3c342c" stroke="none">полка 1080</text>
</g>

<text x="390" y="92" font-size="15" font-weight="700" fill="#241c16">Бок</text>
<g transform="translate(400,108) scale(0.30)" fill="none" stroke="#2a241e">
<polygon points="0,0 25,6.7 25,1450 0,1450" fill="#e7e0d4" stroke-width="4"/>
<polygon points="400,107 375,100.3 375,1450 400,1450" fill="#e7e0d4" stroke-width="4"/>
<polygon points="25,6.7 375,100.3 375,128 25,36" fill="#fffdf8" stroke-width="4"/>
<rect x="25" y="1425" width="350" height="25" fill="#fffdf8" stroke-width="4"/>
<rect x="25" y="370" width="25" height="25" fill="#fffdf8" stroke-width="4"/>
<rect x="350" y="370" width="25" height="25" fill="#fffdf8" stroke-width="4"/>
<rect x="50" y="378" width="300" height="18" fill="#fffdf8" stroke-width="4"/>
<rect x="100" y="1155" width="25" height="250" fill="#fffdf8" stroke-width="4"/>
<rect x="325" y="1155" width="25" height="250" fill="#fffdf8" stroke-width="4"/>
<rect x="125" y="1155" width="200" height="25" fill="#fffdf8" stroke-width="4"/>
<rect x="125" y="1380" width="200" height="25" fill="#fffdf8" stroke-width="4"/>
<text x="36" y="780" font-size="36" fill="#c45c12" stroke="none" font-weight="700">П1</text>
<text x="300" y="780" font-size="36" fill="#c45c12" stroke="none" font-weight="700">П2</text>
<text x="160" y="90" font-size="36" fill="#c45c12" stroke="none" font-weight="700">В3</text>
<text x="150" y="1414" font-size="36" fill="#c45c12" stroke="none" font-weight="700">Н2</text>
<text x="155" y="368" font-size="32" fill="#c45c12" stroke="none" font-weight="700">С2</text>
<text x="175" y="1260" font-size="32" fill="#c45c12" stroke="none" font-weight="700">Д1</text>
<text x="175" y="1330" font-size="32" fill="#c45c12" stroke="none" font-weight="700">Д2</text>
<text x="40" y="-16" font-size="32" fill="#3c342c" stroke="none">1450</text>
<text x="250" y="180" font-size="32" fill="#3c342c" stroke="none">15°</text>
</g>

<text x="36" y="590" font-size="15" font-weight="700" fill="#241c16">Низ</text>
<g transform="translate(36,608) scale(0.32)" fill="none" stroke="#2a241e">
<rect x="0" y="0" width="1000" height="400" stroke-width="2"/>
<path d="M0 0 H25 V25 H0 Z" fill="#e7e0d4" stroke-width="3"/>
<path d="M1000 0 H975 V25 H1000 Z" fill="#e7e0d4" stroke-width="3"/>
<path d="M0 400 H25 V375 H0 Z" fill="#e7e0d4" stroke-width="3"/>
<path d="M1000 400 H975 V375 H1000 Z" fill="#e7e0d4" stroke-width="3"/>
<rect x="25" y="0" width="950" height="18" fill="#fffdf8" stroke-width="3"/>
<rect x="25" y="382" width="950" height="18" fill="#fffdf8" stroke-width="3"/>
<rect x="0" y="25" width="18" height="350" fill="#fffdf8" stroke-width="3"/>
<rect x="982" y="25" width="18" height="350" fill="#fffdf8" stroke-width="3"/>
<text x="450" y="55" font-size="36" fill="#c45c12" stroke="none" font-weight="700">Н1</text>
<text x="450" y="368" font-size="36" fill="#c45c12" stroke="none" font-weight="700">Н1</text>
<text x="36" y="210" font-size="36" fill="#c45c12" stroke="none" font-weight="700">Н2</text>
<text x="820" y="210" font-size="36" fill="#c45c12" stroke="none" font-weight="700">Н2</text>
<text x="80" y="120" font-size="28" fill="#3c342c" stroke="none">полки стоек наружу</text>
</g>

<text x="400" y="590" font-size="15" font-weight="700" fill="#241c16">Полка на 1080</text>
<g transform="translate(400,608) scale(0.32)" fill="none" stroke="#2a241e">
<rect x="0" y="0" width="1000" height="400" stroke-width="2"/>
<path d="M0 0 H25 V25 H0 Z" fill="#e7e0d4" stroke-width="3"/>
<path d="M1000 0 H975 V25 H1000 Z" fill="#e7e0d4" stroke-width="3"/>
<path d="M0 400 H25 V375 H0 Z" fill="#e7e0d4" stroke-width="3"/>
<path d="M1000 400 H975 V375 H1000 Z" fill="#e7e0d4" stroke-width="3"/>
<rect x="25" y="25" width="950" height="25" fill="#fffdf8" stroke-width="3"/>
<rect x="25" y="350" width="950" height="25" fill="#fffdf8" stroke-width="3"/>
<rect x="250" y="50" width="16" height="300" fill="#fffdf8" stroke-width="3"/>
<rect x="560" y="50" width="16" height="300" fill="#fffdf8" stroke-width="3"/>
<rect x="900" y="50" width="16" height="300" fill="#fffdf8" stroke-width="3"/>
<text x="420" y="46" font-size="36" fill="#c45c12" stroke="none" font-weight="700">С1</text>
<text x="420" y="346" font-size="36" fill="#c45c12" stroke="none" font-weight="700">С1</text>
<text x="600" y="210" font-size="36" fill="#c45c12" stroke="none" font-weight="700">С2</text>
<text x="55" y="210" font-size="28" fill="#8a4e10" stroke="none">250 под бак</text>
</g>

<text x="790" y="92" font-size="15" font-weight="700" fill="#241c16">Угол сверху</text>
<g transform="translate(790,114)" fill="none" stroke="#2a241e">
<path d="M0 0 H230 V64 H64 V190 H0 Z" fill="#e7e0d4" stroke-width="3"/>
<text x="78" y="40" font-size="16" fill="#241c16" stroke="none">ригель, торец встык</text>
<text x="8" y="120" font-size="16" fill="#241c16" stroke="none">стойка</text>
<text x="0" y="220" font-size="14" fill="#3c342c" stroke="none">Полки стойки по наружным граням.</text>
<text x="0" y="240" font-size="14" fill="#3c342c" stroke="none">Длина ригеля равна просвету: 950 или 350.</text>
</g>

<text x="790" y="400" font-size="15" font-weight="700" fill="#241c16">Запил</text>
<g transform="translate(790,424)" fill="none" stroke="#2a241e">
<polygon points="30,160 30,24 92,41 92,160" fill="#e7e0d4" stroke-width="3"/>
<line x1="10" y1="24" x2="130" y2="24" stroke-width="1.4" stroke-dasharray="6 4"/>
<path d="M30 24 L48 24 A18 18 0 0 1 44 36" stroke-width="1.6"/>
<text x="100" y="20" font-size="14" fill="#241c16" stroke="none">15° от прямого</text>
<text x="0" y="100" font-size="14" fill="#c45c12" stroke="none" font-weight="700">длинная</text>
<text x="98" y="110" font-size="14" fill="#3c342c" stroke="none">короткая</text>
<text x="0" y="190" font-size="14" fill="#3c342c" stroke="none">15° от прямого реза = 75° к оси стойки.</text>
<text x="0" y="210" font-size="14" fill="#3c342c" stroke="none">П1 мерить длинную кромку: 1450. Короткая 1443.</text>
<text x="0" y="230" font-size="14" fill="#3c342c" stroke="none">П2 мерить длинную кромку: 1350. Угол снаружи 1343.</text>
<text x="0" y="250" font-size="14" fill="#3c342c" stroke="none">В3: обе продольные кромки 362, резы параллельны.</text>
<text x="0" y="270" font-size="14" fill="#3c342c" stroke="none">Низ стоек 90°.</text>
</g>

<text x="790" y="740" font-size="14" fill="#3c342c">Просвет: ширина 950, глубина 350.</text>
<text x="790" y="762" font-size="14" fill="#3c342c">С2 стоит между полками С1, длина 300.</text>
<text x="790" y="784" font-size="14" fill="#3c342c">Дверка вставки: Д1 250, Д2 200, проём 200×200.</text>
<text x="790" y="806" font-size="14" fill="#3c342c">Площадки подачи и наддува в каркас не входят.</text>
</svg>
