<g transform="translate(800,596)"><circle r="11" fill="#c45c12"/><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" dy="0.35em">4</text><text x="20" y="4">Дверь фасада. Запас руки сверх хода не задан</text></g>
<g transform="translate(800,628)"><circle r="11" fill="#c45c12"/><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" dy="0.35em">5</text><text x="20" y="4">Подача и обратка: кран и 90° в стену</text></g>
