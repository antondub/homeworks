<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <rect width="1680" height="1080" fill="#f7f4ee"/>
  <text x="28" y="32" font-size="22" font-weight="700" fill="#1c1916">Шкаф котла, предварительная компоновка</text>
  <text x="28" y="54" font-size="13" fill="#3d3832">Не обмер и не доказательство, что оборудование помещается. Серое — каталог, не этот котёл. Оранжевый пунктир — размер не задан.</text>

  <text x="36" y="84" font-size="15" font-weight="700">Вид спереди фасада</text>
  <g transform="translate(36,96)">
    <rect x="0" y="0" width="400" height="560" fill="#fff" stroke="#1c1916" stroke-width="2"/>
    <text x="200" y="18" text-anchor="middle" font-size="11" fill="#6a6258">Ш около 1000, В около 1500, предварительно</text>
    <rect x="28" y="200" width="160" height="280" fill="#d5e4f0" stroke="#1c1916" stroke-width="1.6"/>
    <text x="108" y="320" text-anchor="middle" font-size="13" font-weight="700">котёл боком</text>
    <text x="108" y="338" text-anchor="middle" font-size="11" fill="#6a6258">габарит не снят</text>
    <rect x="188" y="390" width="78" height="64" fill="#f4efe4" stroke="#1c1916"/>
    <text x="227" y="418" text-anchor="middle" font-size="12">горелка</text>
    <text x="227" y="434" text-anchor="middle" font-size="10" fill="#6a6258">вылет не снят</text>
    <rect x="278" y="360" width="108" height="130" fill="none" stroke="#c46a12" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="332" y="414" text-anchor="middle" font-size="12" fill="#8a4e10">ход</text>
    <text x="332" y="430" text-anchor="middle" font-size="12" fill="#8a4e10">уточнить</text>
    <line x1="266" y1="422" x2="300" y2="422" stroke="#c46a12" stroke-width="1.6"/>
    <polygon points="300,416 312,422 300,428" fill="#c46a12"/>
    <text x="292" y="352" font-size="11" fill="#c46a12">извлечение</text>
    <rect x="188" y="78" width="120" height="70" fill="#fff6e8" stroke="#8a4e10" stroke-dasharray="4 3"/>
    <text x="248" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#8a4e10">бак топлива</text>
    <text x="248" y="122" text-anchor="middle" font-size="11" fill="#8a4e10">пожелание</text>
    <text x="248" y="138" text-anchor="middle" font-size="10" fill="#8a4e10">не подтверждено</text>
    <rect x="28" y="78" width="146" height="56" fill="#fff" stroke="#8a8378" stroke-dasharray="4 3"/>
    <text x="101" y="102" text-anchor="middle" font-size="12">полка отопителя</text>
    <text x="101" y="118" text-anchor="middle" font-size="10" fill="#6a6258">размер не снят</text>
    <line x1="70" y1="200" x2="70" y2="168" stroke="#1c1916" stroke-width="1.4"/>
    <line x1="118" y1="200" x2="118" y2="168" stroke="#1c1916" stroke-width="1.4"/>
    <rect x="62" y="160" width="16" height="10" fill="#fff" stroke="#1c1916"/>
    <rect x="110" y="160" width="16" height="10" fill="#fff" stroke="#1c1916"/>
    <text x="82" y="230" font-size="11">подача</text>
    <text x="130" y="248" font-size="11">обратка</text>
    <rect x="28" y="500" width="120" height="42" fill="#fff" stroke="#8a8378" stroke-dasharray="4 3"/>
    <text x="88" y="518" text-anchor="middle" font-size="11">электроника</text>
    <text x="88" y="532" text-anchor="middle" font-size="10" fill="#6a6258">размер не снят</text>

  </g>
  <text x="36" y="674" font-size="12">Кран подачи и кран обратки. Не два подряд.</text>
  <text x="36" y="692" font-size="12">Дальше 90 градусов в стену, см. план.</text>
  <text x="36" y="710" font-size="12">Это не гидравлическая схема.</text>
  <text x="36" y="736" font-size="12">Насос топлива, насос контура, вентилятор</text>
  <text x="36" y="754" font-size="12">внутри. Места не назначены.</text>

  <text x="470" y="84" font-size="15" font-weight="700">План, фасад снизу листа</text>
  <g transform="translate(470,108)">
    <rect x="0" y="36" width="400" height="160" fill="#fff" stroke="#1c1916" stroke-width="2"/>
    <rect x="0" y="20" width="400" height="16" fill="#4a453f"/>
    <text x="200" y="14" text-anchor="middle" font-size="12">стена, сторона на схеме условная</text>
    <rect x="24" y="70" width="150" height="96" fill="#d5e4f0" stroke="#1c1916"/>
    <text x="99" y="114" text-anchor="middle" font-size="12" font-weight="700">котёл боком</text>
    <text x="99" y="130" text-anchor="middle" font-size="10" fill="#6a6258">каталог не этот котёл</text>
    <rect x="174" y="86" width="64" height="52" fill="#f4efe4" stroke="#1c1916"/>
    <text x="206" y="116" text-anchor="middle" font-size="11">горелка</text>
    <rect x="250" y="52" width="130" height="128" fill="none" stroke="#c46a12" stroke-dasharray="5 3"/>
    <text x="315" y="112" text-anchor="middle" font-size="12" fill="#8a4e10">ход уточнить</text>
    <line x1="238" y1="112" x2="268" y2="112" stroke="#c46a12" stroke-width="1.6"/>
    <polygon points="268,106 280,112 268,118" fill="#c46a12"/>
    <line x1="50" y1="70" x2="50" y2="36" stroke="#1c1916"/>
    <line x1="90" y1="70" x2="90" y2="36" stroke="#1c1916"/>
    <rect x="42" y="46" width="16" height="10" fill="#fff" stroke="#1c1916"/>
    <rect x="82" y="46" width="16" height="10" fill="#fff" stroke="#1c1916"/>
    <text x="200" y="214" text-anchor="middle" font-size="12">ширина около 1000, глубина около 400, предварительно</text>

  </g>
  <text x="470" y="360" font-size="12">В глубину около 400 смотрит ширина котла, не паспортные 500 или 530.</text>
  <text x="470" y="378" font-size="12">Вдоль ширины около 1000 — длина котла, вылет горелки и ход извлечения.</text>
  <text x="470" y="396" font-size="12" fill="#8a4e10">400 мм как достаточные не утверждаются.</text>

  <g transform="translate(470,430)">
    <rect width="760" height="250" fill="#fff6f5" stroke="#b42318"/>
    <text x="16" y="24" font-size="14" font-weight="700" fill="#b42318">Бак топлива — пожелание, не допуск</text>
    <text x="16" y="46" font-size="13">Выше горелки, около верха теплообменника или чуть выше.</text>
    <text x="16" y="66" font-size="13">Прямо над горячими узлами без проверки нагрева не ставить.</text>
    <text x="16" y="86" font-size="13">Протечка не должна попадать на горелку и котёл: разнос, экран, поддон.</text>
    <text x="16" y="106" font-size="13">Бак выше горелки даёт самотёк и сифон. На остановке нужна отсечка.</text>
    <text x="16" y="126" font-size="13">Безопасность этого места не подтверждена.</text>
    <text x="16" y="152" font-size="13">Накопитель 240 л — в гараже, на этой схеме его нет.</text>
    <text x="16" y="172" font-size="13">Малый бак из прежнего списка: назначение не сказано, здесь не показан отдельно.</text>
    <text x="16" y="198" font-size="13">Полка дизельного отопителя: размер, зазоры, воздух и герметичный</text>
    <text x="16" y="218" font-size="13">выхлоп наружу надо уточнить. Выхлоп в шкаф не показан и не предполагается.</text>
    <text x="16" y="238" font-size="13">Электроника — в стороне от горячего, труб и протечек. Размер не снят.</text>
  </g>

  <g transform="translate(470,698)">
    <rect width="760" height="150" fill="#fff" stroke="#1c1916"/>
    <text x="16" y="24" font-size="14" font-weight="700">Снять на месте, прежде чем утверждать 400 мм</text>
    <text x="16" y="46" font-size="12">Габарит котла после переделки: ширина, глубина, высота с ногами и уклоном крышки.</text>
    <text x="16" y="64" font-size="12">Вылет горелки и нужный ход извлечения. Полки уголка и патрубки сверх корпуса.</text>
    <text x="16" y="82" font-size="12">Влезает ли ширина котла в глубину около 400 с зазором у стенок.</text>
    <text x="16" y="100" font-size="12">Длина котла, горелки и хода вдоль ширины около 1000. Места двух кранов и отвода в стену.</text>
    <text x="16" y="118" font-size="12">Бак топлива, отопитель, коробка, насосы, вентилятор, малый бак: размеры и зазоры.</text>
    <text x="16" y="136" font-size="12">Толщина стенок шкафа. Запор перед предохранителем этой схемой не задаётся.</text>
  </g>

  <text x="470" y="870" font-size="12" fill="#5c564e">Насос топлива форсунки, циркуляционный насос и вентилятор воздуха — из прежнего состава, габариты не сняты.</text>
  <text x="470" y="890" font-size="12" fill="#5c564e">Котёл и горелка описаны в ../burner/. Эта папка только про шкаф.</text>
</svg>
