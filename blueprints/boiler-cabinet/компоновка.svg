<g transform="translate(800,724)"><circle r="11" fill="#c45c12"/><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" dy="0.35em">8</text><text x="20" y="4">Электроника у двери. Насосы и вентилятор — места</text></g>
</g>
<text x="48" y="830" font-size="13" fill="#6b6258">Накопитель 240 л в гараже, не в шкафу. Глубина около 400 не проверена: в неё смотрит ширина котла, рамка 210, полки и патрубки шире.</text>
<text x="48" y="852" font-size="13" fill="#6b6258">Пунктир без размера — место оборудования, не его габарит. Запас руки сверх хода 150 не задан.</text>
