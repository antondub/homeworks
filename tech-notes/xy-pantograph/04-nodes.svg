<text class="sm" x="328" y="140">верхний уголок</text>
<text class="sm" x="328" y="162">шип</text>
<text class="sm" x="398" y="196">плита 8 мм</text>
<text class="sm" x="286" y="226">UCF204</text>
<text class="sm" x="328" y="266">60T синхронизация</text>
<text class="sm" x="328" y="300">60T редуктор</text>
<text class="sm" x="286" y="350">UCF204</text>
<text class="sm" x="266" y="424">нижний уголок</text>
<text class="sm" x="78" y="458">NEMA 23</text>
<text class="sm" x="78" y="474">под плитой</text>
<line x1="58.0" y1="222.0" x2="58.0" y2="346.0" stroke="#9a3412" stroke-width="1.1" marker-end="url(#ad)"/>
