<text class="sm" x="830" y="352">лыски до 10 мм</text>
<text class="sm" x="830" y="370">болт на срез</text>
<text class="dim" x="714" y="430">пунктир — исходный Ø20</text>
<text class="sm" x="636" y="468">Момент передают лыски. Болт держит шип и работает на срез.</text>
<text class="sm" x="636" y="486">Галтель R3 обязательна: без неё вал треснет у корня.</text>
<rect x="28" y="556" width="570" height="450" rx="10" fill="#fff" stroke="#e0d6c6"/>
