<text class="lab halo" x="300" y="750">ось пальцев</text>
<text class="sm halo" x="300" y="768">вертикальна</text>
<text class="sm" x="60" y="626">плечо 1</text>
<text class="sm" x="400" y="626">плечо 3</text>
<text class="dim" x="300" y="900">Ø12, бронзовая втулка, шплинт снизу</text>
<text class="sm" x="48" y="948">Оба пальца на одной вертикали, иначе ферму скрутит.</text>
<text class="sm" x="48" y="968">На полном вылете угол между плечами 44° — торцы подрезать.</text>
<line x1="50" y1="640" x2="250" y2="640" stroke="#1e4d7b" stroke-width="8" stroke-linecap="round"/>
<line x1="298" y1="640" x2="540" y2="640" stroke="#1f6b4a" stroke-width="8" stroke-linecap="round"/>
