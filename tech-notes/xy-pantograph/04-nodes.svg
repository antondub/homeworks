<rect x="614" y="556" width="558" height="450" rx="10" fill="#fff" stroke="#e0d6c6"/>
<text class="lab" x="630" y="582">4 · Голова, вид сверху</text>
<line x1="660" y1="640" x2="860" y2="690" stroke="#1f6b4a" stroke-width="8" stroke-linecap="round"/>
