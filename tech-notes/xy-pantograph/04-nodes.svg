<text class="sm" x="700" y="230">Ø20</text>
<text class="dim" x="836" y="236">шип 28×10, галтель R3</text>
<text class="sm" x="848" y="140">накладка 6 мм</text>
<text class="sm" x="636" y="280">Вид с торца</text>
<circle cx="760" cy="360" r="46" fill="none" stroke="#c5ced6" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="714" y="344" width="92" height="32" fill="#d5dde3" stroke="#2a241e" stroke-width="1.6"/>
