<text class="dim halo" x="50.0" y="284.0" text-anchor="end" dominant-baseline="middle">160</text>
<text class="sm" x="48" y="516">Вал Ø20 Ст45, около 270 мм. Винты обоих UCF держат вал от осевого сдвига.</text>
<rect x="614" y="88" width="558" height="450" rx="10" fill="#fff" stroke="#e0d6c6"/>
<text class="lab" x="630" y="114">2 · Шип вала и уголок</text>
<text class="sm" x="636" y="140">Вид сбоку</text>
<path d="M700,172 H812 V164 Q830,164 836,178 H910 V190 Q830,204 812,196 V196 H700 Z" fill="#d5dde3" stroke="#2a241e" stroke-width="1.4"/>
