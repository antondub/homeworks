<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
<rect width="1080" height="620" fill="#f6f3ea"/>
<defs>
<style type="text/css"><![CDATA[
text { font-family: DejaVu Sans, Liberation Sans, sans-serif; fill: #241c16; }
.title { font-size: 22px; font-weight: 700; }
.lab { font-size: 15px; font-weight: 700; }
.sm { font-size: 13px; fill: #3c342c; }
.pin { font-size: 13px; fill: #241c16; }
]]></style>
</defs>
<text class="title" x="16" y="32">Модули в ряд, стык сбоку</text>
<rect x="16" y="56" width="180" height="100" rx="8" fill="#dce8d6" stroke="#241c16" stroke-width="2"/><text class="lab" x="106" y="96" text-anchor="middle">база</text><text class="sm" x="106" y="122" text-anchor="middle">ESP32</text><rect x="202" y="78" width="20" height="64" rx="3" fill="#2a5a38"/><text class="sm" x="212" y="166" text-anchor="middle">стык</text><rect x="230" y="56" width="180" height="100" rx="8" fill="#f3f0ea" stroke="#241c16" stroke-width="2"/><text class="lab" x="320" y="96" text-anchor="middle">место 0</text><text class="sm" x="320" y="122" text-anchor="middle">верхний CS0</text><rect x="416" y="78" width="20" height="64" rx="3" fill="#2a5a38"/><text class="sm" x="426" y="166" text-anchor="middle">стык</text><rect x="444" y="56" width="180" height="100" rx="8" fill="#f3f0ea" stroke="#241c16" stroke-width="2"/><text class="lab" x="534" y="96" text-anchor="middle">место 1</text><text class="sm" x="534" y="122" text-anchor="middle">верхний CS1</text><rect x="630" y="78" width="20" height="64" rx="3" fill="#2a5a38"/><text class="sm" x="640" y="166" text-anchor="middle">стык</text><rect x="658" y="56" width="180" height="100" rx="8" fill="#ffffff" stroke="#241c16" stroke-width="2"/><text class="lab" x="748" y="96" text-anchor="middle">место 2</text><text class="sm" x="748" y="122" text-anchor="middle">сдвиг</text><rect x="844" y="78" width="20" height="64" rx="3" fill="#2a5a38"/><text class="sm" x="854" y="166" text-anchor="middle">стык</text><rect x="872" y="56" width="180" height="100" rx="8" fill="#f3f0ea" stroke="#241c16" stroke-width="2"/><text class="lab" x="962" y="96" text-anchor="middle">место 3</text><text class="sm" x="962" y="122" text-anchor="middle">верхний CS3</text><text class="sm" x="16" y="186">Плата всегда берёт верхний CS. Последняя видит на нём CS3.</text><text class="title" x="16" y="230">Один модуль</text><rect x="16" y="248" width="1048" height="36" fill="#dce8d6" stroke="#2a5a38"/><text class="lab" x="180" y="272" text-anchor="middle">разъём слева</text><text class="lab" x="540" y="272" text-anchor="middle">эта плата</text><text class="lab" x="900" y="272" text-anchor="middle">справа тот же контакт</text><rect x="16" y="294" width="1048" height="32" fill="#ffffff" stroke="#d5d0c6"/><line x1="40" y1="310" x2="1040" y2="310" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="316" text-anchor="middle">5 В</text><text class="pin" x="540" y="316" text-anchor="middle">питание</text><text class="pin" x="900" y="316" text-anchor="middle">5 В</text><rect x="16" y="326" width="1048" height="32" fill="#f3f0ea" stroke="#d5d0c6"/><line x1="40" y1="342" x2="1040" y2="342" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="348" text-anchor="middle">GND</text><text class="pin" x="540" y="348" text-anchor="middle">земля</text><text class="pin" x="900" y="348" text-anchor="middle">GND</text><rect x="16" y="358" width="1048" height="32" fill="#ffffff" stroke="#d5d0c6"/><line x1="40" y1="374" x2="1040" y2="374" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="380" text-anchor="middle">SCK</text><text class="pin" x="540" y="380" text-anchor="middle">на SPI</text><text class="pin" x="900" y="380" text-anchor="middle">SCK</text><rect x="16" y="390" width="1048" height="32" fill="#f3f0ea" stroke="#d5d0c6"/><line x1="40" y1="406" x2="1040" y2="406" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="412" text-anchor="middle">MOSI</text><text class="pin" x="540" y="412" text-anchor="middle">на SPI</text><text class="pin" x="900" y="412" text-anchor="middle">MOSI</text><rect x="16" y="422" width="1048" height="32" fill="#ffffff" stroke="#d5d0c6"/><line x1="40" y1="438" x2="1040" y2="438" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="444" text-anchor="middle">MISO</text><text class="pin" x="540" y="444" text-anchor="middle">на SPI, только свой CS</text><text class="pin" x="900" y="444" text-anchor="middle">MISO</text><rect x="16" y="454" width="1048" height="32" fill="#f3f0ea" stroke="#d5d0c6"/><line x1="40" y1="470" x2="1040" y2="470" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="476" text-anchor="middle">CS0</text><text class="pin" x="540" y="476" text-anchor="middle">берём, направо не идёт</text><text class="pin" x="900" y="476" text-anchor="middle">сюда поднят CS1</text><rect x="16" y="486" width="1048" height="32" fill="#ffffff" stroke="#d5d0c6"/><line x1="40" y1="502" x2="1040" y2="502" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="508" text-anchor="middle">CS1</text><text class="pin" x="540" y="508" text-anchor="middle">поднимается наверх</text><text class="pin" x="900" y="508" text-anchor="middle">сюда поднят CS2</text><rect x="16" y="518" width="1048" height="32" fill="#f3f0ea" stroke="#d5d0c6"/><line x1="40" y1="534" x2="1040" y2="534" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="540" text-anchor="middle">CS2</text><text class="pin" x="540" y="540" text-anchor="middle">поднимается наверх</text><text class="pin" x="900" y="540" text-anchor="middle">сюда поднят CS3</text><rect x="16" y="550" width="1048" height="32" fill="#ffffff" stroke="#d5d0c6"/><line x1="40" y1="566" x2="1040" y2="566" stroke="#c4beb4" stroke-width="1"/><text class="pin" x="180" y="572" text-anchor="middle">CS3</text><text class="pin" x="540" y="572" text-anchor="middle">поднимается наверх</text><text class="pin" x="900" y="572" text-anchor="middle">пусто</text></svg>
