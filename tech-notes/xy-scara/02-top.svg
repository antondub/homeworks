<text class="sm" x="28.0" y="718.0">Плиты — треугольники: три бобышки, три ребра. Глаза локтя: 1 плечо A, 2 прямая тяга, 3 изогнутая тяга Б.</text>
<text class="sm" x="28.0" y="740.0">Ярусы сверху: изогнутые тяги и верх A; плиты; прямая тяга и верх Б; низ Б; низ A.</text>
<text class="sm" x="28.0" y="762.0">Складка: изогнутая тяга Б и верх A на одном ярусе — сдвиг по пальцу 2–3 мм, не в одном пятне.</text>
