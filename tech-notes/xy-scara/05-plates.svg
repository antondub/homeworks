<text class="sm" x="60.0" y="575.0">Три бобышки, три ребра, треугольник.</text>
<text class="sm" x="60.0" y="593.0">Кривошип 90 мм — прямая тяга на глаз 2.</text>
<text class="sm" x="60.0" y="611.0">Ось тяги 158 мм — изогнутая тяга на вынос Б.</text>
<text class="sm" x="60.0" y="629.0">Третье ребро замыкает кривошип и ось тяги.</text>
<text class="sm" x="60.0" y="647.0">Вынос Б: палец Ø12, втулка бронза или 6201.</text>
