<text class="sm" x="580.0" y="590.0">Перевёрнутая Т. Два глаза на ножке.</text>
<text class="sm" x="580.0" y="608.0">К стене 64 мм — изогнутая тяга Б.</text>
<text class="sm" x="580.0" y="626.0">Перекладина 45 мм, зазор под уголок Б.</text>
<text class="sm" x="580.0" y="644.0">Ярус 2 вместе с плитами кривошипа и локтя.</text>
