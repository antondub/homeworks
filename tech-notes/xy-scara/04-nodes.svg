<rect x="70" y="250" width="90" height="36" fill="#c8c2b4" stroke="#2a241e" stroke-width="1.6"/>
<text class="sm" x="115.0" y="238.0" text-anchor="middle">тяга, один слой</text>
<rect x="158" y="236" width="54" height="8" fill="#8a8376" stroke="#2a241e"/>
<rect x="158" y="292" width="54" height="8" fill="#8a8376" stroke="#2a241e"/>
<rect x="178" y="248" width="70" height="44" fill="#d8cbb3" stroke="#2a241e" stroke-width="1.6"/>
<rect x="204" y="220" width="10" height="100" rx="2" fill="#5c6770" stroke="#2a241e"/>
<circle cx="209" cy="218" r="7" fill="#9aa3ad" stroke="#2a241e"/>
<rect x="198" y="314" width="22" height="8" rx="1" fill="#9aa3ad" stroke="#2a241e"/>
<text class="sm" x="70.0" y="370.0">Щёки 6 мм, палец Ø12.</text>
<text class="sm" x="70.0" y="388.0">На пальце проставка,</text>
<text class="sm" x="70.0" y="406.0">если два звена.</text>
<text class="lab" x="540.0" y="100.0" text-anchor="middle">изогнутая тяга</text>
<rect x="350" y="120" width="360" height="480" rx="6" fill="#efe8dc" stroke="#c4b8a4"/>
<polyline points="400.0,400.0 626.2,440.0 690.0,400.0" fill="none" stroke="#6b3a1f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400.0" cy="400.0" r="12" fill="#efe8dc" stroke="#2a241e" stroke-width="1.7"/><circle cx="400.0" cy="400.0" r="3.2" fill="#5c6770"/>
<circle cx="690.0" cy="400.0" r="12" fill="#efe8dc" stroke="#2a241e" stroke-width="1.7"/><circle cx="690.0" cy="400.0" r="3.2" fill="#5c6770"/>
<text class="sm halo" x="560.0" y="368.0">слом к глазу 3</text>
<text class="sm" x="370.0" y="500.0">Длинная часть вдоль плеча,</text>
<text class="sm" x="370.0" y="518.0">слом у плиты локтя. Один слой.</text>
<text class="lab" x="900.0" y="100.0" text-anchor="middle">плита локтя</text>
<rect x="730" y="120" width="340" height="480" rx="6" fill="#efe8dc" stroke="#c4b8a4"/>
