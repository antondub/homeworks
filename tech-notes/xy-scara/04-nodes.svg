<circle cx="995.0" cy="340.0" r="28" fill="#c4b49a" stroke="#2a241e" stroke-width="1.6"/>
<circle cx="882.0" cy="252.0" r="28" fill="#c4b49a" stroke="#2a241e" stroke-width="1.6"/>
<circle cx="900.0" cy="340.0" r="11" fill="#efe8dc" stroke="#2a241e" stroke-width="1.7"/><circle cx="900.0" cy="340.0" r="3.2" fill="#5c6770"/>
<circle cx="995.0" cy="340.0" r="11" fill="#efe8dc" stroke="#2a241e" stroke-width="1.7"/><circle cx="995.0" cy="340.0" r="3.2" fill="#5c6770"/>
<circle cx="882.0" cy="252.0" r="11" fill="#efe8dc" stroke="#2a241e" stroke-width="1.7"/><circle cx="882.0" cy="252.0" r="3.2" fill="#5c6770"/>
<text class="sm halo" x="900.0" y="384.0" text-anchor="middle">1 плечо A</text>
<text class="sm halo" x="995.0" y="384.0" text-anchor="middle">2 прямая тяга</text>
<text class="sm halo" x="812.0" y="258.0">3 изогнутая тяга Б</text>
<line x1="900.0" y1="400" x2="995.0" y2="400" stroke="#9a3412" stroke-width="1.3" marker-end="url(#ad)"/>
<line x1="995.0" y1="400" x2="900.0" y2="400" stroke="#9a3412" stroke-width="1.3" marker-end="url(#ad)"/>
<text class="dim" x="947.5" y="418.0" text-anchor="middle">90</text>
<text class="sm" x="750.0" y="470.0">Треугольник. Ребро 1–2 = 90 мм.</text>
<text class="sm" x="750.0" y="488.0">Третье ребро замыкает 2 и 3.</text>
<text class="sm" x="750.0" y="506.0">Глаз 3: изогнутая тяга Б. Не равносторонний.</text>
<text class="sm" x="750.0" y="532.0">Лист 8–10 мм, плазма.</text>
</svg>
