<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<rect width="100%" height="100%" fill="#f6f3ea"/>
<style>
  text { font-family: "Liberation Sans", sans-serif; fill: #241c16; }
  .title { font-size: 22px; font-weight: 700; }
  .sub { font-size: 13px; fill: #6b6258; }
  .lab { font-size: 14px; font-weight: 700; }
  .sm { font-size: 12px; fill: #3c342c; }
  .dim { font-size: 12px; fill: #9a3412; font-weight: 700; }
  .halo { stroke: #f6f3ea; stroke-width: 4px; paint-order: stroke fill; }
</style>
<defs>
  <marker id="ad" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto">
    <path d="M0,0 L10,4 L0,8 Z" fill="#9a3412"/>
  </marker>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#9aa3ad" stroke-width="1.1"/>
  </pattern>
</defs>
<text class="title" x="28" y="36">Плечо A выше плеча B</text>
<text class="sub" x="28" y="58">Вид сбоку. Колонна Z прикручена к стене, рука вылетает в комнату.</text>
<line x1="28" y1="70" x2="1072" y2="70" stroke="#e0d6c6"/>
<rect x="36" y="110" width="34" height="430" fill="#e4ddd0" stroke="#b7ad9e"/>
<text class="sm" transform="translate(52,340) rotate(-90)" text-anchor="middle">стена</text>
<rect x="70" y="150" width="28" height="380" fill="url(#hatch)" stroke="#2a241e"/>
<text class="sm" x="84" y="142" text-anchor="middle">Z</text>
<rect x="90" y="200" width="36" height="22" fill="#d5dde3" stroke="#2a241e"/>
<!-- shoulder plate -->
<rect x="118" y="150" width="14" height="250" fill="#e4dccf" stroke="#2a241e" stroke-width="1.6"/>
<rect x="108" y="160" width="46" height="28" rx="3" fill="#d5e1f8" stroke="#2456c4"/>
<rect x="108" y="330" width="46" height="28" rx="3" fill="#d5e1f8" stroke="#2456c4"/>
<line x1="154" y1="174" x2="154" y2="344" stroke="#5c6770" stroke-width="6"/>
<circle cx="154" cy="250" r="16" fill="none" stroke="#d85a12" stroke-width="4"/>
<text class="sm halo" x="176" y="148">UCP204</text>
<text class="sm halo" x="176" y="360">UCP204</text>
<text class="lab halo" x="176" y="254">A</text>
<!-- upper arm -->
<line x1="154" y1="168" x2="560" y2="168" stroke="#1e4d7b" stroke-width="10" stroke-linecap="round"/>
<text class="lab halo" x="340" y="156" text-anchor="middle">плечо A</text>
<!-- elbow plate -->
<rect x="548" y="150" width="14" height="250" fill="#e4dccf" stroke="#2a241e" stroke-width="1.6"/>
<rect x="534" y="160" width="46" height="28" rx="3" fill="#d5e1f8" stroke="#2456c4"/>
<rect x="534" y="330" width="46" height="28" rx="3" fill="#d5e1f8" stroke="#2456c4"/>
<line x1="590" y1="174" x2="590" y2="400" stroke="#5c6770" stroke-width="6"/>
<circle cx="590" cy="250" r="16" fill="none" stroke="#d85a12" stroke-width="4"/>
<rect x="548" y="210" width="70" height="36" rx="3" fill="#e7f0d4" stroke="#2a241e"/>
<text class="sm" x="583" y="232" text-anchor="middle">мотор B</text>
<text class="lab halo" x="610" y="254">B</text>
<!-- lower arm -->
<line x1="590" y1="392" x2="960" y2="392" stroke="#1f6b4a" stroke-width="10" stroke-linecap="round"/>
<text class="lab halo" x="760" y="378" text-anchor="middle">плечо B</text>
<rect x="952" y="372" width="48" height="40" rx="3" fill="#f3d2c4" stroke="#8c3b14"/>
<text class="sm halo" x="976" y="364" text-anchor="middle">голова</text>
<line x1="154" y1="188" x2="154" y2="316" stroke="#9a3412" stroke-width="1.1" marker-end="url(#ad)"/>
<line x1="154" y1="316" x2="154" y2="188" stroke="#9a3412" stroke-width="1.1" marker-end="url(#ad)"/>
<text class="dim halo" x="132" y="260" text-anchor="end">120</text>
<text class="sm" x="28" y="560">Зазор по высоте больше трубы 40 мм, плечи проходят друг над другом и складываются до каретки.</text>
<text class="sm" x="28" y="582">Мотор B стоит на плите колена и едет вместе с плечом A. Кабель к нему — петлёй вдоль этого плеча.</text>
</svg>
