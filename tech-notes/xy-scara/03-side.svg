  <text
     class="sm"
     x="28.0"
     y="456.0"
     id="text42">Палец Ø12 сквозь ярусы, проставка между соседними. Плита локтя — треугольник, глаза 1 2 3 в одном листе.</text>
  <text
     class="sm"
     x="28.0"
     y="474.0"
     id="text43">Уголок A разомкнут: верх на ярусе 1, низ на 5. Уголок Б сплошной на 3 и 4 после короткого выноса.</text>
  <text
     xml:space="preserve"
     style="font-size:6.66667px;line-height:1.25;font-family:sans-serif;-inkscape-font-specification:sans-serif;white-space:pre;inline-size:225.788"
     x="760.68732"
     y="360.51971"
     id="text44"
     transform="translate(101.70958,-41.075021)"><tspan
       x="760.68732"
       y="360.51971"
       id="tspan1">ну бред же, справа на лево, у нас идет крепление инструмента на </tspan><tspan
       x="760.68732"
       y="368.85307"
       id="tspan2">широкой пластине, от нее отступ и крепление плеча Б - левее, и </tspan><tspan
       x="760.68732"
       y="377.18641"
       id="tspan3">еще левее, на 64мм кажется ты рисовал, крепление рычага Б, </tspan><tspan
       x="760.68732"
       y="385.51976"
       id="tspan4">крепления плеча Б по аналогии с локтем и креплением плеча А</tspan></text>
