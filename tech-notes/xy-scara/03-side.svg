  <!-- layer legend -->
  <text
     class="sm"
     x="28.0"
     y="380.0"
     id="text37">1 верх: изогнутые тяги и верх A. На пальце глаза 3 тяга Б на 2–3 мм ниже верха A — при складке не в одном пятне.</text>
  <text
     class="sm"
     x="28.0"
     y="398.0"
     id="text38">2 плиты кривошипа, локтя и головы. 3 прямая тяга и верх Б. 4 низ Б. 5 низ A.</text>
  <text
     class="sm"
     x="28.0"
     y="416.0"
     id="text39">Прямая тяга и верх Б — один ярус, сдвиг на глазе 2. Низ A под низом Б: в плане складка, по высоте разные ярусы.</text>
  <text
     class="sm"
     x="28.0"
     y="434.0"
     id="text40">Справа пластина под устройство. Влево пальцы: изогнутая тяга (ярус 1) и плечо Б (ярусы 3–4).</text>
  <line
     x1="22"
