<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<rect width="100%" height="100%" fill="#f6f3ea"/>
<style>
  text { font-family: "Liberation Sans", sans-serif; fill: #241c16; }
  .title { font-size: 22px; font-weight: 700; }
  .sub { font-size: 13px; fill: #6b6258; }
  .lab { font-size: 14px; font-weight: 700; }
  .sm { font-size: 12px; fill: #3c342c; }
  .dim { font-size: 12px; fill: #9a3412; font-weight: 700; }
  .halo { stroke: #f6f3ea; stroke-width: 4px; paint-order: stroke fill; }
</style>
<text class="title" x="28" y="36">Плита каретки: моторы A и B на одной оси</text>
<text class="sub" x="28" y="58">Вал A и кривошип соосны. Локоть — те же UCP204, без мотора и без ремня.</text>
<line x1="28" y1="70" x2="1072" y2="70" stroke="#e0d6c6"/>

<rect x="150" y="100" width="240" height="540" rx="4" fill="#efe8dc" stroke="#2a241e" stroke-width="1.8"/>
<text class="lab" x="270" y="126" text-anchor="middle">плита 8–10 мм</text>

<rect x="200" y="148" width="140" height="64" rx="8" fill="#d5e1f8" stroke="#2456c4" stroke-width="1.8"/>
<circle cx="246" cy="180" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="294" cy="180" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="270" cy="180" r="16" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<text class="sm" x="352" y="184">UCP204</text>

<line x1="270" y1="196" x2="270" y2="520" stroke="#5c6770" stroke-width="8"/>

<circle cx="270" cy="270" r="40" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<circle cx="270" cy="270" r="8" fill="#5c6770"/>
<text class="sm halo" x="270" y="274" text-anchor="middle">60T</text>

<circle cx="270" cy="400" r="72" fill="none" stroke="#9a3412" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="270" cy="400" r="40" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<circle cx="270" cy="400" r="8" fill="#5c6770"/>
<line x1="270" y1="400" x2="202" y2="375" stroke="#9a3412" stroke-width="4"/>
<circle cx="202" cy="375" r="6" fill="#9a3412"/>
<text class="sm halo" x="36" y="378">палец, 90 мм</text>
<text class="sm halo" x="270" y="424" text-anchor="middle">60T</text>

<rect x="200" y="500" width="140" height="64" rx="8" fill="#d5e1f8" stroke="#2456c4" stroke-width="1.8"/>
<circle cx="246" cy="532" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="294" cy="532" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="270" cy="532" r="16" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<text class="sm" x="352" y="536">UCP204</text>

<circle cx="500" cy="270" r="16" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<text class="sm halo" x="500" y="248" text-anchor="middle">20T</text>
<line x1="310" y1="252" x2="486" y2="260" stroke="#d85a12" stroke-width="5"/>
<line x1="310" y1="288" x2="486" y2="280" stroke="#d85a12" stroke-width="5"/>
<rect x="560" y="246" width="120" height="52" rx="4" fill="#e7f0d4" stroke="#2a241e" stroke-width="1.6"/>
<text class="lab" x="620" y="268" text-anchor="middle">мотор A</text>
<text class="sm" x="620" y="286" text-anchor="middle">NEMA 23, 3:1</text>

<circle cx="500" cy="400" r="16" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<text class="sm halo" x="500" y="378" text-anchor="middle">20T</text>
<line x1="310" y1="382" x2="486" y2="390" stroke="#d85a12" stroke-width="5"/>
<line x1="310" y1="418" x2="486" y2="410" stroke="#d85a12" stroke-width="5"/>
<rect x="560" y="376" width="120" height="52" rx="4" fill="#e7f0d4" stroke="#2a241e" stroke-width="1.6"/>
<text class="lab" x="620" y="398" text-anchor="middle">мотор B</text>
<text class="sm" x="620" y="416" text-anchor="middle">NEMA 23, 3:1</text>

<text class="lab" x="720" y="150">На каретке</text>
<text class="sm" x="720" y="174">Вал A крутит мотор A.</text>
<text class="sm" x="720" y="194">Плечо A зажато выше верхней опоры.</text>
<text class="sm" x="720" y="214">Кривошип на своей втулке,</text>
<text class="sm" x="720" y="234">соосен валу A, его крутит мотор B.</text>
<text class="sm" x="720" y="254">Палец — 90 мм от оси, в плоскости тяги.</text>

<text class="lab" x="720" y="310">На локте</text>
<text class="sm" x="720" y="334">Пара UCP204, около 120 мм между центрами.</text>
<text class="sm" x="720" y="354">Мотора и ремня нет.</text>
<text class="sm" x="720" y="374">Рычаг 90 мм на валу B, в плоскости тяги.</text>
<text class="sm" x="720" y="394">Плечо B зажато ниже нижней опоры.</text>
<text class="sm" x="720" y="414">Тяга 450 мм соединяет два пальца.</text>

<text class="lab" x="720" y="470">Почему так</text>
<text class="sm" x="720" y="494">Угол мотора B равен углу плеча B.</text>
<text class="sm" x="720" y="514">Между опорами каретки около 200 мм:</text>
<text class="sm" x="720" y="534">шкив A и диск кривошипа стоят друг над другом.</text>

<text class="sm" x="28" y="680">Вал Ø20, Ст45. Оба ремня HTD5M, 20 зубьев на моторе, 60 на валу. Диск кривошипа больше шкива: палец снаружи делительной окружности.</text>
</svg>
