<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
<rect width="100%" height="100%" fill="#f6f3ea"/>
<style>
  text { font-family: "Liberation Sans", sans-serif; fill: #241c16; }
  .title { font-size: 22px; font-weight: 700; }
  .sub { font-size: 13px; fill: #6b6258; }
  .lab { font-size: 14px; font-weight: 700; }
  .sm { font-size: 12px; fill: #3c342c; }
  .dim { font-size: 12px; fill: #9a3412; font-weight: 700; }
  .halo { stroke: #f6f3ea; stroke-width: 4px; paint-order: stroke fill; }
</style>
<text class="title" x="28" y="36">Плита оси A и такая же плита оси B</text>
<text class="sub" x="28" y="58">Одна вертикальная плита. UCP204 сверху и снизу. Вал параллелен плите. Ремень между опорами.</text>
<line x1="28" y1="70" x2="1072" y2="70" stroke="#e0d6c6"/>
<!-- face -->
<rect x="180" y="110" width="220" height="460" rx="4" fill="#efe8dc" stroke="#2a241e" stroke-width="1.8"/>
<text class="lab" x="290" y="136" text-anchor="middle">плита 8–10 мм</text>
<!-- upper UCP -->
<rect x="230" y="160" width="120" height="70" rx="8" fill="#d5e1f8" stroke="#2456c4" stroke-width="1.8"/>
<circle cx="270" cy="195" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="310" cy="195" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="290" cy="195" r="16" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<text class="sm" x="360" y="200">UCP204</text>
<!-- shaft -->
<line x1="290" y1="211" x2="290" y2="430" stroke="#5c6770" stroke-width="8"/>
<!-- pulley -->
<circle cx="290" cy="300" r="46" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<circle cx="290" cy="300" r="8" fill="#5c6770"/>
<text class="sm halo" x="290" y="304" text-anchor="middle">60T</text>
<!-- lower UCP -->
<rect x="230" y="400" width="120" height="70" rx="8" fill="#d5e1f8" stroke="#2456c4" stroke-width="1.8"/>
<circle cx="270" cy="435" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="310" cy="435" r="6" fill="#fff" stroke="#2456c4"/>
<circle cx="290" cy="435" r="16" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<text class="sm" x="360" y="440">UCP204</text>
<!-- motor shelf -->
<rect x="430" y="360" width="120" height="64" rx="4" fill="#e7f0d4" stroke="#2a241e" stroke-width="1.6"/>
<text class="lab" x="490" y="388" text-anchor="middle">NEMA 23</text>
<text class="sm" x="490" y="408" text-anchor="middle">полка на плите</text>
<circle cx="490" cy="300" r="18" fill="#fff" stroke="#2a241e" stroke-width="2"/>
<text class="sm halo" x="490" y="276" text-anchor="middle">20T</text>
<line x1="328" y1="278" x2="474" y2="292" stroke="#d85a12" stroke-width="5"/>
<line x1="328" y1="322" x2="474" y2="308" stroke="#d85a12" stroke-width="5"/>
<path d="M328,278 A46,46 0 0 1 328,322" fill="none" stroke="#d85a12" stroke-width="5"/>
<path d="M474,292 A18,18 0 0 0 474,308" fill="none" stroke="#d85a12" stroke-width="5"/>
<text class="sm halo" x="390" y="262">ремень HTD5M</text>
<text class="dim" x="180" y="250">3:1</text>
<!-- side note -->
<text class="lab" x="640" y="150">На оси A</text>
<text class="sm" x="640" y="174">Плечо уходит выше верхней опоры.</text>
<text class="sm" x="640" y="194">Плита стоит на каретке Y.</text>
<text class="lab" x="640" y="250">На оси B</text>
<text class="sm" x="640" y="274">Та же плита на конце плеча A.</text>
<text class="sm" x="640" y="294">Плечо B уходит ниже нижней опоры.</text>
<text class="sm" x="640" y="314">Мотор едет вместе с локтем.</text>
<text class="lab" x="640" y="370">Почему UCP, а не UCF</text>
<text class="sm" x="640" y="394">У UCP вал параллелен подошве.</text>
<text class="sm" x="640" y="414">Обе опоры болтятся к одной</text>
<text class="sm" x="640" y="434">вертикальной плите.</text>
<text class="sm" x="640" y="460">База между центрами около 120 мм.</text>
<text class="sm" x="28" y="610">Вал Ø20, Ст45. Шкив 60 зубьев на шпонке между опорами. Мотор на горизонтальной полке, его вал вертикальный.</text>
</svg>
