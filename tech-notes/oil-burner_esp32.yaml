esphome:
  name: oilburner
  friendly_name: OilBurner
  on_loop:
    then:
      - lambda: |-

          if(!id(fanOn)){
            if(millis() >= id(fan_off_timer)) {
              id(out_fan).turn_off();
              id(fanSpeedSens).publish_state(0);
              id(fan_off_timer) = millis()+60000;
              ESP_LOGI("loop", "Fan off. fan_off_timer: %d ", id(fan_off_timer));
            }
          }

          if(!id(pumpOn)) {

            id(next_pulse_timer) = millis()+50;
            id(pulse_started_off_at) = millis()-50;

          } else {

            if(millis() >= id(pulse_started_off_at)) {

              if(id(state) <= 1) {
              
                  id(out_power_pulse).turn_off();
                  id(state) = 0;
                  id(pulse_started_off_at) = millis() + id(pdelay)*1000;
                  id(pump_off).turn_off();
                  //ESP_LOGD("loop", "deccel is ok,  state: %d, pulse_started_off_at:%d, next_pulse_timer: %d, millis: %d ", id(state), id(pulse_started_off_at), id(next_pulse_timer), millis());
              
              } else {
              
                int freq = id(startFreq) + (id(state)-1) * id(pumpAccel);
                id(out_power_pulse).update_frequency(freq);
                id(pulse_started_off_at) = millis() + 1;
                id(state) -= 1;
              
              }
            }
            
            if(millis() >= id(next_pulse_timer)) {
              
              if(!id(pump_off).state)
                id(pump_off).turn_on();

              id(next_pulse_timer) = millis() + 1;

              if(id(state) < 1) {

                id(out_power_pulse).set_frequency(id(startFreq));
                id(out_power_pulse).turn_on();
                id(out_power_pulse).set_level(0.5);

              } else if(id(state) >= id(steps)) {

                if(id(maxSpeedTime) > 0) {
                  id(out_power_pulse).update_frequency(id(pumpMaxSpeed));
                  id(out_power_pulse).set_level(0.5);
                }
                id(next_pulse_timer) = millis() + id(maxSpeedTime) + id(pdelay)*1000;
                //ESP_LOGD("loop", "accel is ok,  state: %d, pulse_started_off_at:%d, next_pulse_timer: %d, millis: %d ", id(state), id(pulse_started_off_at), id(next_pulse_timer), millis());

              } else {

                int freq = id(startFreq) + id(state) * id(pumpAccel);
                id(out_power_pulse).update_frequency(freq);
                id(out_power_pulse).set_level(0.5);

              }

              id(pulse_started_off_at) = millis() + id(maxSpeedTime) + id(steps);
  
              id(state) += 1;
  
            }
          }

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret apikey_oilburner

ota:
  - platform: esphome
    password: !secret otapass_oilburner

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret wifissid_oilburner
    password: !secret wifipass_oilburner

captive_portal:

web_server:
  port: 80

spi:
  miso_pin: GPIO12
  mosi_pin: GPIO13
  clk_pin: GPIO14

globals:
  - id: pulses
    type: long
    restore_value: no
    initial_value: '0'
  - id: next_pulse_timer
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: pulse_started_off_at
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: fan_off_timer
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: fanOn
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: fan_speed
    type: int
    restore_value: no
    initial_value: '0'
  - id: pumpOn
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ppt
    type: int
    restore_value: no
    initial_value: '20000'
  - id: mlpt
    type: int
    restore_value: no
    initial_value: '5'
  - id: pumpAccel
    type: float
    restore_value: no
    initial_value: '1200'
  - id: pumpMaxSpeed
    type: float
    restore_value: no
    initial_value: '20000'
  - id: period
    type: int
    restore_value: no
    initial_value: '4'
  - id: pdelay
    type: float
    restore_value: no
    initial_value: '2.0'
  - id: steps
    type: int
    restore_value: no
    initial_value: '0'
  - id: maxSpeedTime
    type: long
    restore_value: no
    initial_value: '0'
  - id: state
    type: int
    restore_value: no
    initial_value: '0'
  - id: startFreq
    type: int
    restore_value: no
    initial_value: '2000'
  - id: g_automatic_mode
    type: bool
    restore_value: no
    initial_value: "false"
  - id: g_automatic_temp
    type: float
    restore_value: no
    initial_value: "40.0"
  - id: g_automatic_flow
    type: int
    restore_value: no
    initial_value: "20"
  - id: g_automatic_off
    type: int
    restore_value: no
    initial_value: "0"
  - id: g_automatic_stage
    type: int
    restore_value: no
    initial_value: "0"
  - id: g_heatonce_mode
    type: bool
    restore_value: no
    initial_value: "false"

switch:
  # - platform: gpio
  #   pin: GPIO18
  #   id: ds_vcc
  - platform: gpio
    pin: GPIO5
    inverted: True
    id: pump_off
  # - platform: gpio
  #   pin: GPIO22
  #   inverted: False
  #   id: fan1
  - platform: template
    name: "Manual/Automatic"
    id: sw_automatic_mode
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(g_automatic_mode);
    turn_on_action:
      - globals.set:
          id: g_automatic_mode
          value: "true"
      - globals.set:
          id: g_automatic_off
          value: "0"
    turn_off_action:
      - globals.set:
          id: g_automatic_mode
          value: "false"
  - platform: template
    name: "Heating Once"
    id: sw_heatonce_mode
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(g_heatonce_mode);
    turn_on_action:
      - globals.set:
          id: g_heatonce_mode
          value: "true"
    turn_off_action:
      - globals.set:
          id: g_heatonce_mode
          value: "false"

