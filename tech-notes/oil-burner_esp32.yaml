esphome:
  name: oilburner
  friendly_name: OilBurner
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(out_air).set_level(id(air_us).state / 20000.0f);
          id(out_pump).set_level(id(pump_us).state / 20000.0f);

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret apikey_oilburner

ota:
  - platform: esphome
    password: !secret otapass_oilburner

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: !secret wifissid_oilburner
    password: !secret wifipass_oilburner

captive_portal:

web_server:
  port: 80

spi:
  miso_pin: GPIO12
  mosi_pin: GPIO13
  clk_pin: GPIO14

output:
  - platform: ledc
    id: out_air
    pin: GPIO25
    frequency: 50 Hz
  - platform: ledc
    id: out_pump
    pin: GPIO26
    frequency: 50 Hz

switch:
  - platform: gpio
    name: "ESC power"
    id: esc_power
    pin: GPIO23
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    name: "Ignition"
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 40ms
  - platform: gpio
    name: "Stop"
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 40ms
  - platform: gpio
    name: "Pin 18"
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 40ms

sensor:
  - platform: adc
    id: flame_v
    name: "Flame"
    pin: GPIO33
    attenuation: 11db
    update_interval: 0.5s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement

  - platform: max6675
    id: coolant_t
    name: "Coolant"
    cs_pin: GPIO27
    update_interval: 1s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

number:
  - platform: template
    id: air_us
    name: "ESC air us"
    min_value: 1000
    max_value: 2000
    step: 10
    initial_value: 1000
    restore_value: false
    optimistic: true
    mode: BOX
    unit_of_measurement: "µs"
    on_value:
      then:
        - lambda: 'id(out_air).set_level(x / 20000.0f);'
  - platform: template
    id: pump_us
    name: "ESC pump us"
    min_value: 1000
    max_value: 2000
    step: 10
    initial_value: 1000
    restore_value: false
    optimistic: true
    mode: BOX
    unit_of_measurement: "µs"
    on_value:
      then:
        - lambda: 'id(out_pump).set_level(x / 20000.0f);'
