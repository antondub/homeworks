<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anton Dubinin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #aaaaaa;
            margin: 0 0 20px 0;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a {
            color: #4da6ff;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Anton Dubinin</h1>
    <p>Software engineer. Development, automation, and DIY engineering projects.</p>
    <div class="links">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub Projects</a>
        <a href="https://t.me" target="_blank" rel="noopener noreferrer">Telegram: @AntonyDy</a>
    </div>
</div>

</body>
</html>
