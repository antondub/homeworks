esphome:
  name: heatingold
  friendly_name: heatingOld
  platform: ESP8266
  board: nodemcuv2
  esp8266_restore_from_flash: yes

logger:

api:
  encryption:
    key: !secret apikey_oldheater

ota:
  - platform: esphome
    password: !secret otapass_oldheater

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

web_server:
  port: 80

time:
  - platform: homeassistant
    timezone: "Europe/Moscow"
    id: ha_time

globals:
  - id: g_automatic_mode
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: g_daynight_mode
    type: bool
    restore_value: yes
    initial_value: "true"

  - id: g_threshold_temp_off
    type: float
    restore_value: no
    initial_value: "65.0"

  - id: g_threshold_temp_k
    type: float
    restore_value: no
    initial_value: "0.4"

  - id: g_threshold_temp_targ
    type: float
    restore_value: yes
    initial_value: "21.0"

  - id: g_threshold_temp_night
    type: float
    restore_value: yes
    initial_value: "20.5"

  - id: g_night_start
    type: int
    restore_value: yes
    initial_value: "0"

  - id: g_night_end
    type: int
    restore_value: yes
    initial_value: "6"

  - id: g_boost_c
    type: float
    restore_value: yes
    initial_value: "2.0"

  - id: g_boost_min
    type: int
    restore_value: yes
    initial_value: "60"

  - id: g_prev_temp_targ
    type: float
    restore_value: yes
    initial_value: "20.0"

  - id: g_room_m3
    type: float
    restore_value: yes
    initial_value: "125.0"

  - id: g_heat_k
    type: float
    restore_value: yes
    initial_value: "0.95"

  - id: g_flow_lph
    type: float
    restore_value: yes
    initial_value: "170.0"

  - id: g_tin_w
    type: float
    restore_value: yes
    initial_value: "0.0"

  - id: g_q_need
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: g_q_now
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: g_heater1_kw
    type: float
    restore_value: yes
    initial_value: "2.0"

  - id: g_heater2_kw
    type: float
    restore_value: yes
    initial_value: "4.0"

  - id: g_power_kw
    type: float
    restore_value: no
    initial_value: "0.0"

one_wire:
  - platform: gpio
    pin: GPIO5
    #update_interval: 30s

text_sensor:
  - platform: template
    name: "Climat Period"
    id: climat_period
    update_interval: 60s
    lambda: |-
      auto time = id(ha_time).now();
      if(!time.is_valid()) return {"no time"};
      if(!id(g_daynight_mode)) return {"day"};
      int h = time.hour;
      int a = id(g_night_start);
      int b = id(g_night_end);
      bool night = false;
      if(a < b) night = h >= a && h < b;
      else if(a > b) night = h >= a || h < b;
      if(night) return {"night"};
      if(a != b && id(g_boost_c) > 0 && id(g_boost_min) > 0) {
        int elapsed = h * 60 + time.minute - b * 60;
        if(elapsed < 0) elapsed += 1440;
        float span = id(g_threshold_temp_targ) - id(tempOut).state;
        if(elapsed < id(g_boost_min) && span > 0) return {"boost"};
      }
      return {"day"};

sensor:
  - platform: dallas_temp
    address: 0x5e358ad443b15d28
    name: "TempHeaterTop"
    update_interval: 5s
    id: tempTop
    resolution: 12
    on_value:
      then:
        - lambda: |-
            float tT = id(tempTop).state;
            if ( tT > id(g_threshold_temp_off)){
              id(heater1).turn_off();
              id(heater2).turn_off();
              id(g_power_kw) = 0;
              id(heater_pwm).publish_state(0);
              return;
            }

            if(!id(g_automatic_mode)){
              id(heater1).turn_off();
              id(heater2).turn_off();
              id(g_power_kw) = 0;
              id(heater_pwm).publish_state(0);
              id(g_prev_temp_targ) = 0;
              return;
            }
          
            float t1 = id(tempOut).state;
            float tD = id(tempDown).state;
            if(isnan(t1)) return;
            float targ = id(g_threshold_temp_targ);
            auto time = id(ha_time).now();
            if(id(g_daynight_mode) && time.is_valid()) {
              int h = time.hour;
              int a = id(g_night_start);
              int b = id(g_night_end);
              bool night = false;
              if(a < b) night = h >= a && h < b;
              else if(a > b) night = h >= a || h < b;
              if(night) targ = id(g_threshold_temp_night);
              else if(a != b && id(g_boost_c) > 0 && id(g_boost_min) > 0) {
                int elapsed = h * 60 + time.minute - b * 60;
                if(elapsed < 0) elapsed += 1440;
                float span = id(g_threshold_temp_targ) - t1;
                if(elapsed < id(g_boost_min) && span > 0) targ += id(g_boost_c) * span / 8.0f;
              }
            }

            float prev = id(g_prev_temp_targ);
            float vol = id(g_room_m3);
            float kv = id(g_heat_k);
            float flow = id(g_flow_lph);
            float q_loss = vol * kv * (targ - t1);
            float q_in = 0;
            if (!isnan(id(tempIn).state)) {
              q_in = vol * kv * (targ - id(tempIn).state);
              q_in += id(g_tin_w) * (targ - id(tempIn).state);
            }
            float q_need = q_loss + q_in;
            if (q_need < 0) q_need = 0;
            float q_now = 1.163f * flow * (tT - tD);
            id(g_q_need) = q_need;
            id(g_q_now) = q_now;
            float out = prev;
            if (flow > 1) out = q_need / (1.163f * flow);
            if(out < 0) out = 0;
            if(out > 40) out = 40;
            if(isnan(out)) out = prev;

            id(g_prev_temp_targ) = out;

            float w1 = id(g_heater1_kw) * 1000.0f;
            float w2 = id(g_heater2_kw) * 1000.0f;
            float l1 = 0;
            float l2 = 0;
            if(q_need > 0 && w1 > 1 && q_need <= w1 * 0.5f){
              l1 = q_need / w1;
            }else if(q_need > 0 && w2 > 1 && q_need <= w2){
              l2 = q_need / w2;
            }else if(q_need > 0 && w2 > 1){
              l1 = 1;
              l2 = (q_need - w1) / w2;
              if(l2 > 1) l2 = 1;
            }else if(q_need > 0 && w1 > 1){
              l1 = q_need / w1;
              if(l1 > 1) l1 = 1;
            }
            id(heater1).set_level(l1);
            id(heater2).set_level(l2);
            id(g_power_kw) = l1 * id(g_heater1_kw) + l2 * id(g_heater2_kw);
            float wsum = id(g_heater1_kw) + id(g_heater2_kw);
            float pwm = 0;
            if(wsum > 0) pwm = id(g_power_kw) / wsum * 100;
            id(heater_pwm).publish_state(pwm);

            ESP_LOGD("calculation", "targ %.2f, tOut %.2f, q_loss %.2f, q_in %.2f, q_need %.2f, q_now %.2f, out %.2f", targ, t1, q_loss, q_in, q_need, q_now, out);

    filters:
      - calibrate_polynomial:
          degree: 2
          datapoints:
          - -11.5 -> -10.5
          - 0.2 -> -0.7
          - 23.0 -> 23.0
          - 53.0 -> 48.0

  - platform: dallas_temp
    address: 0x3b3ce10457bc9928
    name: "TempHeaterDown"
    update_interval: 5s
    id: tempDown
    resolution: 12
    filters:
      - calibrate_polynomial:
          degree: 2
          datapoints:
          - -11.5 -> -10.5
          - 0.2 -> -0.7
          - 23.0 -> 23.0
          - 53.0 -> 48.0

  - platform: template
    name: "TempHeaterDrop"
    id: tempDrop
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    update_interval: 30s
    lambda: |-
      if (isnan(id(tempTop).state) || isnan(id(tempDown).state)) return NAN;
      return id(tempTop).state - id(tempDown).state;

  - platform: template
    name: "Heat Need"
    id: heat_need
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    update_interval: 30s
    lambda: |-
      return id(g_q_need);

  - platform: template
    name: "Heat Now"
    id: heat_now
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    update_interval: 5s
    lambda: |-
      return id(g_q_now);
    filters:
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1

  - platform: template
    name: "Heat Power"
    id: heat_power
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    device_class: power
    update_interval: 30s
    lambda: |-
      return id(g_power_kw);
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  - platform: dallas_temp
    address: 0x047ac9d443851128
    name: "TempOut"
    update_interval: 120s
    id: tempOut
    resolution: 12
    filters:
      - calibrate_polynomial:
          degree: 2
          datapoints:
          - -11.5 -> -10.5
          - 0.2 -> -0.7
          - 23.0 -> 23.0
          - 53.0 -> 48.0

  - platform: dallas_temp
    address: 0x4d3ce10457242228
    name: "TempIn"
    update_interval: 60s
    id: tempIn
    resolution: 12
    filters:
      - calibrate_polynomial:
          degree: 2
          datapoints:
          - -11.5 -> -10.5
          - 0.2 -> -0.7
          - 23.0 -> 23.0
          - 53.0 -> 48.0

  - platform: template
    device_class: power_factor
    unit_of_measurement: "%"
    name: "Heater PWM"
    id: heater_pwm


  - platform: template
    device_class: temperature
    unit_of_measurement: "°C"
    update_interval: 30s
    name: "Climate Target"
    lambda: |-
      return id(g_prev_temp_targ);

switch:
  - platform: gpio
    pin: GPIO14
    name: "pin1"

  - platform: gpio
    pin: GPIO12
    name: "pin2"
    id: out_heater2
    on_turn_on:
      then:
        - lambda: |-
            auto water_temperature = id(tempTop).state;
            if ( water_temperature > id(g_threshold_temp_off)){
              id(out_heater2).turn_off();
              ESP_LOGD("pin2", "g_threshold_temp_off tempTop.state %.2f", water_temperature);
            }

  - platform: gpio
    pin: GPIO13
    name: "pin3"

  - platform: gpio
    pin: GPIO15
    name: "pin4"
    id: out_heater1
    on_turn_on:
      then:
        - lambda: |-
            auto water_temperature = id(tempTop).state;
            if ( water_temperature > id(g_threshold_temp_off)){
              id(out_heater1).turn_off();
              ESP_LOGD("pin4", "g_threshold_temp_off tempTop.state %.2f", water_temperature);
            }
  
  - platform: template
    name: "Climat Manual/Automatic"
    id: sw_automatic_mode
    restore_mode: DISABLED
    lambda: return id(g_automatic_mode);
    turn_on_action:
      - globals.set:
          id: g_automatic_mode
          value: "true"
    turn_off_action:
      - globals.set:
          id: g_automatic_mode
          value: "false"

  - platform: template
    name: "Climat Day/Night"
    id: sw_daynight_mode
    restore_mode: DISABLED
    lambda: return id(g_daynight_mode);
    turn_on_action:
      - globals.set:
          id: g_daynight_mode
          value: "true"
    turn_off_action:
      - globals.set:
          id: g_daynight_mode
          value: "false"

number:
  - platform: template
    name: "Climat Desired Temp"
    id: val_target_temp
    device_class: temperature
    mode: box
    unit_of_measurement: "°C"
    min_value: 18
    max_value: 25
    step: 0.1
    lambda: return id(g_threshold_temp_targ);
    set_action:
      - globals.set:
          id: g_threshold_temp_targ
          value: !lambda return x;

  - platform: template
    name: "Climat Night Temp"
    id: val_night_temp
    device_class: temperature
    mode: box
    unit_of_measurement: "°C"
    min_value: 18
    max_value: 25
    step: 0.1
    lambda: return id(g_threshold_temp_night);
    set_action:
      - globals.set:
          id: g_threshold_temp_night
          value: !lambda return x;

  - platform: template
    name: "Night Start"
    id: val_night_start
    mode: box
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    lambda: return id(g_night_start);
    set_action:
      - globals.set:
          id: g_night_start
          value: !lambda return (int) x;

  - platform: template
    name: "Night End"
    id: val_night_end
    mode: box
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    lambda: return id(g_night_end);
    set_action:
      - globals.set:
          id: g_night_end
          value: !lambda return (int) x;

  - platform: template
    name: "Morning Boost"
    id: val_boost_c
    device_class: temperature
    mode: box
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 5
    step: 0.1
    lambda: return id(g_boost_c);
    set_action:
      - globals.set:
          id: g_boost_c
          value: !lambda return x;

  - platform: template
    name: "Morning Boost Time"
    id: val_boost_min
    mode: box
    unit_of_measurement: "min"
    min_value: 0
    max_value: 180
    step: 5
    lambda: return id(g_boost_min);
    set_action:
      - globals.set:
          id: g_boost_min
          value: !lambda return (int) x;

  - platform: template
    name: "Room Volume"
    id: val_room_volume
    mode: box
    unit_of_measurement: "m³"
    min_value: 0
    max_value: 500
    step: 0.1
    lambda: return id(g_room_m3);
    set_action:
      - globals.set:
          id: g_room_m3
          value: !lambda return x;

  - platform: template
    name: "Heat Loss K"
    id: val_heat_per_m3
    mode: box
    unit_of_measurement: "W/m³K"
    min_value: 0
    max_value: 5
    step: 0.01
    lambda: return id(g_heat_k);
    set_action:
      - globals.set:
          id: g_heat_k
          value: !lambda return x;

  - platform: template
    name: "Water Flow"
    id: val_water_flow
    mode: box
    unit_of_measurement: "L/h"
    min_value: 0
    max_value: 3000
    step: 1
    lambda: return id(g_flow_lph);
    set_action:
      - globals.set:
          id: g_flow_lph
          value: !lambda return x;

  - platform: template
    name: "TempIn Trim"
    id: val_tin_w
    mode: box
    unit_of_measurement: "W/K"
    min_value: 0
    max_value: 100
    step: 0.5
    lambda: return id(g_tin_w);
    set_action:
      - globals.set:
          id: g_tin_w
          value: !lambda return x;

  - platform: template
    name: "Heater 1 Power"
    id: val_heater1_kw
    mode: box
    unit_of_measurement: "kW"
    min_value: 0
    max_value: 10
    step: 0.1
    lambda: return id(g_heater1_kw);
    set_action:
      - globals.set:
          id: g_heater1_kw
          value: !lambda return x;

  - platform: template
    name: "Heater 2 Power"
    id: val_heater2_kw
    mode: box
    unit_of_measurement: "kW"
    min_value: 0
    max_value: 10
    step: 0.1
    lambda: return id(g_heater2_kw);
    set_action:
      - globals.set:
          id: g_heater2_kw
          value: !lambda return x;

output:
  - platform: slow_pwm
    id: heater2
    period: 30s
    restart_cycle_on_state_change: false
    turn_on_action:
      - lambda: |-
          auto *out = id(out_heater2);
          out->turn_on();
    turn_off_action:
      - lambda: |-
          auto *out = id(out_heater2);
          out->turn_off();

  - platform: slow_pwm
    id: heater1
    period: 30s
    restart_cycle_on_state_change: false
    turn_on_action:
      - lambda: |-
          auto *out = id(out_heater1);
          out->turn_on();
    turn_off_action:
      - lambda: |-
          auto *out = id(out_heater1);
          out->turn_off();
